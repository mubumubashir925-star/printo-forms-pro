  const dfRangeActive = _pubDateFilter.type === 'range' ? 'active' : '';
  const dfFromVal     = _pubDateFilter.from || '';
  const dfToVal       = _pubDateFilter.to   || '';
  const dateFilterHtml = `
  <div class="pub-filter-group">
    <div class="pub-filter-head" onclick="pubToggleFilterGroup('__date__')">
      <span>Filter by Date</span>
      <svg class="pub-filter-head-icon ${dfOpen ? 'open' : ''}" id="pfh-icon-__date__"
        width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div id="pfp-__date__" class="pub-date-filter-pills" ${dfOpen ? '' : 'style="display:none"'}>
      <span class="pub-date-pill ${dfTodayActive}" style="--filter-acc:${acc}"
        onclick="pubSetDateFilter('today',this)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Today
      </span>
      <span class="pub-date-pill ${dfYestActive}" style="--filter-acc:${acc}"
        onclick="pubSetDateFilter('yesterday',this)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Yesterday
      </span>
      <span class="pub-date-pill ${dfRangeActive}" style="--filter-acc:${acc}"
        onclick="pubSetDateFilter('range',this)">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
        Date Range
      </span>
    </div>
    <div id="pfp-__date__-range" class="pub-date-range-row" style="${_pubDateFilter.type==='range' && dfOpen ? '' : 'display:none'}">
      <label>From</label>
      <input type="date" id="pub-date-from" class="pub-date-input" value="${dfFromVal}"
        onchange="pubDateRangeChanged()">
      <label>To</label>
      <input type="date" id="pub-date-to" class="pub-date-input" value="${dfToVal}"
        onchange="pubDateRangeChanged()">
      <button class="pub-date-apply-btn" id="pub-date-apply-btn"
        style="--filter-acc:${acc}" onclick="pubApplyDateRange()">Apply</button>
    </div>
  </div>`;
  const activeBarHtml = hasFilter ? `
      <div class="pub-filter-active-bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span>Filter active — ${filteredTotal} matching, ${filteredOwn} yours</span>
        <button class="pub-filter-reset" onclick="pubClearFilters()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Reset Filter
        </button>
      </div>` : '';
  // Filters (dropdown pills + date filter) are manager-only. Normal users
  // never get here with anything to filter — they only ever load their own
  // entries — so the whole filter wrap is skipped for them.
  if (_pubManagerMode) {
    filterHtml = (filterHtml
      ? filterHtml.replace(/<\/div>\s*$/, '') + dateFilterHtml + activeBarHtml + `</div>`
      : `<div class="pub-filter-wrap" id="pub-filter-wrap">` + dateFilterHtml + activeBarHtml + `</div>`);
  } else {
    filterHtml = '';
  }

  // ── Stats bar ─────────────────────────────────────
  const statsBar = `
    <div class="pub-stats-bar">
      <div class="pub-stat-chip">
        <span class="pub-stat-chip-num" id="pub-stat-total">${total.toLocaleString()}</span>
        <span class="pub-stat-chip-lbl">Total entries</span>
      </div>
      <div class="pub-stat-chip pub-stat-chip--own">
        <span class="pub-stat-chip-num" id="pub-stat-own">${ownCount.toLocaleString()}</span>
        <span class="pub-stat-chip-lbl">From this device</span>
      </div>
      <span id="pub-new-note" style="display:none;font-size:.72em;color:#059669;font-weight:700;background:#ecfdf5;padding:3px 9px;border-radius:100px;border:1px solid #a7f3d0"></span>
    </div>`;

  // ── Privacy notice ────────────────────────────────
  const privNote = `
    <div class="pub-privacy-notice">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" style="flex-shrink:0"><path d="M10 2a5 5 0 0 0-5 5v2H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm3 7H7V7a3 3 0 1 1 6 0v2z" fill="#166534"/></svg>
      ${_pubManagerMode
        ? `<span>Manager view — showing all ${total} entr${total===1?'y':'ies'}.</span>`
        : ownCount > 0
        ? `<span>Showing your <strong>${ownCount}</strong> entr${ownCount===1?'y':'ies'} — other submissions are private. Count syncs every 60s.</span>`
        : `<span>${total} total entr${total===1?'y':'ies'} — submit the form to see yours here.</span>`
      }
    </div>`;

  // ── Search ────────────────────────────────────────
  const searchBar = `
    <div style="position:relative;margin-bottom:12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="pub-ent-search" class="form-input"
        style="padding-left:34px;background:#fff;border:1.5px solid #e5e7eb"

      ${searchQ ? `<button onclick="document.getElementById('pub-ent-search').value='';pubEntSearch('')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;display:flex;align-items:center;padding:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}

  // ── Toolbar ───────────────────────────────────────

    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <button onclick="pubEntSort('newest')" class="pub-sort-btn" id="pbs-newest">Newest</button>
      <button onclick="pubEntSort('oldest')" class="pub-sort-btn" id="pbs-oldest">Oldest</button>
      <button onclick="pubEntSort('name')"   class="pub-sort-btn" id="pbs-name">A–Z</button>
      <div style="flex:1"></div>
      ${_pubManagerMode && !hasFilter ? `
      <button onclick="pubToggleFilterMine()" class="pub-sort-btn ${mineBtnActive ? 'pbs-active' : ''}" id="pbs-mine" style="display:inline-flex;align-items:center;gap:4px">
        <svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M10 2a5 5 0 0 0-5 5v2H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm3 7H7V7a3 3 0 1 1 6 0v2z" fill="currentColor"/></svg>
        Mine${ownCount > 0 ? ' ('+ownCount+')' : ''}
      </button>` : ''}
      <button onclick="refreshPubEntries()" class="pub-sort-btn" title="Refresh" style="display:inline-flex;align-items:center;gap:4px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      ${window._pubFormDef && window._pubFormDef.hasManagerPassword ? `
      <button onclick="openManagerSignIn()" class="pub-sort-btn" id="mgr-signin-btn"
        style="display:inline-flex;align-items:center;gap:5px;border-color:${_pubManagerMode ? 'rgba(99,102,241,.5)' : 'rgba(99,102,241,.25)'};color:${_pubManagerMode ? '#818cf8' : '#a5b4fc'}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        ${_pubManagerMode ? '✓ Manager View' : 'Manager Sign In'}
      </button>` : ''}
    </div>`;

  // ── Cards ─────────────────────────────────────────
  let cardsHtml;
  if (searchQ.trim() && !entries.length) {
    cardsHtml = `<div class="pub-empty-state"><div class="pub-empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><div>No results for "<strong>${searchQ}</strong>"</div><button onclick="document.getElementById('pub-ent-search').value='';pubEntSearch('')" class="pub-empty-btn">Clear search</button></div>`;

      ? `${filteredTotal} filtered entr${filteredTotal===1?'y':'ies'} (${filteredOwn} yours)`
      : searchQ ? entries.filter(r=>r.isOwn).length + ' matching'
      : _pubManagerMode ? entries.length + ' of ' + total + ' entries loaded'
      : entries.length + ' of your ' + ownCount + ' entr' + (ownCount===1?'y':'ies') + ' loaded (' + total + ' total on this form)'
    }

// ── Filter pill toggle ────────────────────────────
function pubToggleFilterPill(fieldIdx, value, el) {
  if (!_pubDropFilters[fieldIdx]) _pubDropFilters[fieldIdx] = new Set();
  const s = _pubDropFilters[fieldIdx];
  if (s.has(value)) { s.delete(value); el.classList.remove('active'); }
  else              { s.add(value);    el.classList.add('active'); }
  renderPubEntriesPanel();
}

function pubToggleFilterGroup(idx) {
  _pubFilterExpanded[idx] = !(_pubFilterExpanded[idx] === true);
  const pillsEl = document.getElementById('pfp-' + idx);
  const iconEl  = document.getElementById('pfh-icon-' + idx);
  if (pillsEl) pillsEl.style.display = _pubFilterExpanded[idx] !== false ? '' : 'none';
  if (iconEl)  iconEl.classList.toggle('open', _pubFilterExpanded[idx] !== false);

  if (idx === '__date__') {
    const rangeRow = document.getElementById('pfp-__date__-range');
    if (rangeRow) rangeRow.style.display =
      (_pubFilterExpanded['__date__'] && _pubDateFilter.type === 'range') ? '' : 'none';

}

function pubClearFilters() {
  _pubDropFilters    = {};
  _pubDateFilter     = { type: null, from: null, to: null };
  _pubFilterExpanded = {};   // collapse all filter groups
  renderPubEntriesPanel();
}

function pubSetDateFilter(type, el) {
  if (_pubDateFilter.type === type) {
    // Toggle off
    _pubDateFilter = { type: null, from: null, to: null };
  } else {
    _pubDateFilter.type = type;
    if (type !== 'range') { _pubDateFilter.from = null; _pubDateFilter.to = null; }

let _pubEntSortCurrent = 'newest';
let _pubFilterMine     = false;
let _pubDropFilters    = {};   // { fieldIdx: Set<value> }
let _pubFilterExpanded = {};   // { fieldIdx: bool }
let _pubFieldCounts    = {};   // { fieldId: { choice: count } } — server-side, full dataset
let _pubDateFilter     = { type: null, from: null, to: null }; // date filter state

function pubEntSort(by) {
  _pubEntSortCurrent = by;
  const arr = _pubManagerMode ? _pubMgrEntries : _pubEntries;
  arr.sort((a, b) =>
    by === 'name'   ? (a.answers[0]||'').localeCompare(b.answers[0]||'') :
    by === 'newest' ? b.timestamp - a.timestamp :
                      a.timestamp - b.timestamp
  );
  renderPubEntriesPanel();
}

function pubToggleFilterMine() {
  _pubFilterMine = !_pubFilterMine;
  renderPubEntriesPanel();
}

let _pubSearchServerTimer = null;
function pubEntSearch(q) {
  clearTimeout(pubEntSearch._t);
  clearTimeout(_pubSearchServerTimer);

  // Immediately filter already-loaded entries client-side
  pubEntSearch._t = setTimeout(() => {
    const grid = document.getElementById('pub-entries-grid');
    const base = _pubManagerMode ? _pubMgrEntries : _pubEntries;
    const entries = q.trim()
      ? base.filter(r => (_pubManagerMode || r.isOwn) && r.answers.some(a => (a||'').toLowerCase().includes(q.toLowerCase())))
      : (_pubManagerMode ? base : (_pubFilterMine ? base.filter(r => r.isOwn) : base));
    if (grid) {
      grid.innerHTML = entries.map(r => buildPubEntryCardHTML(r)).join('');
    } else {
      renderPubEntriesPanel();
      return;
    }
    // Server-side search fallback only applies to normal users — their own
    // entries can span more pages than are currently loaded. Managers already
    // see the full dataset (or can Load More), so this fallback doesn't apply.
    if (!_pubManagerMode) {
      const ownLoaded = base.filter(r => r.isOwn).length;
      if (q.trim() && (ownLoaded < _pubOwnCount || entries.filter(r=>r.isOwn).length === 0)) {
        _pubSearchServerTimer = setTimeout(() => doServerSearch(q), 400);
      }
    }
  }, 180);
}

async function doServerSearch(q) {
  if (!q.trim()) return;
  try {
    const res = await api({ action: 'searchSubmissions', slug: _pubSlug, query: q, deviceId: getDeviceId() });
    if (res.success && res.records.length) {
      // Merge server results into _pubEntries (avoid duplicates)
      const existingRows = new Set(_pubEntries.map(r => r.row));
      const localOwned   = getDeviceOwnedRows(_pubSlug);
      res.records.forEach(r => {
        if (!existingRows.has(r.row)) {
          _pubEntries.push({ ...r, isOwn: true });
          existingRows.add(r.row);
        }
      });
      // Re-render grid with merged results
      const grid = document.getElementById('pub-entries-grid');
      const filtered = _pubEntries.filter(r => r.isOwn && r.answers.some(a => (a||'').toLowerCase().includes(q.toLowerCase())));
      if (grid) grid.innerHTML = filtered.map(r => buildPubEntryCardHTML(r)).join('');
    }
  } catch(e) {}
}

// Fetch choice-field counts for the filter pills — manager-only, called
// right after manager mode activates (sign-in or restored session).
async function loadManagerFieldCounts() {
  try {
    const fcRes = await api({ action: 'getFieldCounts', slug: _pubSlug });
    if (fcRes && fcRes.success && fcRes.counts) {
      _pubFieldCounts = fcRes.counts;
      renderPubEntriesPanel();
    }
  } catch(e) {}
}

async function submitManagerPassword() {
  if (_mgrPwdLockTimer) return; // locked out

  const inp = document.getElementById('mgr-pwd-input');
  const btn = document.getElementById('mgr-pwd-submit');
  const err = document.getElementById('mgr-pwd-error');
  if (!inp) return;

  const pwd = inp.value.trim();
  if (!pwd) { if(err){err.textContent='Please enter the manager password';err.style.display='block';} return; }

  if (btn) { btn.disabled = true; btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px"><svg style="animation:spin 1s linear infinite" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Checking…</span>'; }

  try {
    // Verify by attempting to fetch first page — server checks password
    const res = await api({ action: 'getManagerSubmissions', slug: _pubSlug, managerPassword: pwd, offset: 0, limit: 50 });

    if (res.success && res.isManagerMode) {
      // Password correct — store in sessionStorage and activate manager mode
      sessionStorage.setItem('fbp_mgr_' + _pubSlug, pwd);
      _pubManagerMode  = true;
      _pubMgrEntries   = res.records || [];
      _pubMgrOffset    = _pubMgrEntries.length;
      _pubMgrHasMore   = !!res.hasMore;
      if (typeof res.total === 'number') _pubTotal = res.total;
      document.getElementById('mgr-signin-overlay')?.remove();
      clearInterval(_mgrPwdLockTimer); _mgrPwdLockTimer = null;
      renderPubEntriesPanel();
      loadManagerFieldCounts();
      // Any duplicate data fetched before signing in would be blurred —
      // invalidate it so the Dups tab re-fetches with full manager access
      _pubDupsLoaded = false;
      if (document.getElementById('pub-panel-dups')?.style.display !== 'none') loadPubDups();
      toast('Manager view unlocked', 'success');

    } else if (res.error === 'WRONG_PASSWORD') {
      // Wrong password — start 60s lockout
      if (btn) { btn.disabled = false; btn.innerHTML = 'Sign In'; }
      if (err) { err.textContent = 'Incorrect password.'; err.style.display = 'block'; }
      startMgrLockout();

    } else {
      if (btn) { btn.disabled = false; btn.innerHTML = 'Sign In'; }
      if (err) { err.textContent = res.error || 'Something went wrong.'; err.style.display = 'block'; }
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = 'Sign In'; }
    if (err) { err.textContent = 'Network error. Try again.'; err.style.display = 'block'; }
  }
}

function startMgrLockout() {
  _mgrPwdSecsLeft = 60;
  updateMgrLockoutDisplay();
  const btn = document.getElementById('mgr-pwd-submit');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }
  const inp = document.getElementById('mgr-pwd-input');
  if (inp) { inp.disabled = true; inp.style.opacity = '0.5'; }

  _mgrPwdLockTimer = setInterval(() => {
    _mgrPwdSecsLeft--;
    updateMgrLockoutDisplay();
    if (_mgrPwdSecsLeft <= 0) {
      clearInterval(_mgrPwdLockTimer);
      _mgrPwdLockTimer = null;
      _mgrPwdSecsLeft  = 0;
      const btn2 = document.getElementById('mgr-pwd-submit');
      if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; btn2.style.cursor = 'pointer'; btn2.innerHTML = 'Sign In'; }
      const inp2 = document.getElementById('mgr-pwd-input');
      if (inp2) { inp2.disabled = false; inp2.style.opacity = '1'; inp2.focus(); }
      const lo = document.getElementById('mgr-pwd-lockout');
      if (lo) lo.style.display = 'none';
    }
  }, 1000);
}

function updateMgrLockoutDisplay() {
  const lo  = document.getElementById('mgr-pwd-lockout');
  const btn = document.getElementById('mgr-pwd-submit');
  if (lo) {
    lo.style.display = 'block';
    lo.textContent   = `Too many wrong attempts. Try again in ${_mgrPwdSecsLeft}s`;
  }
  if (btn) btn.innerHTML = `Wait ${_mgrPwdSecsLeft}s`;
}

async function loadMoreMgrEntries() {
  const btn = document.getElementById('pub-load-more-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  const pwd = sessionStorage.getItem('fbp_mgr_' + _pubSlug) || '';
  try {
    const res = await api({ action: 'getManagerSubmissions', slug: _pubSlug, managerPassword: pwd, offset: _pubMgrOffset, limit: 50 });
    if (res.success && res.isManagerMode) {
      const existing = new Set(_pubMgrEntries.map(r => r.row));
      (res.records || []).forEach(r => { if (!existing.has(r.row)) _pubMgrEntries.push(r); });
      _pubMgrOffset += (res.records || []).length;
      _pubMgrHasMore = !!res.hasMore;
      renderPubEntriesPanel();
    } else {
      toast(res.error || 'Failed to load more', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
    }
  } catch(e) {
    toast('Error loading more', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
  }
}

// Auto-restore manager session from sessionStorage on form load
function tryRestoreManagerSession(slug) {
  const pwd = sessionStorage.getItem('fbp_mgr_' + slug);
  if (!pwd) return;
  api({ action: 'getManagerSubmissions', slug, managerPassword: pwd, offset: 0, limit: 50 })
    .then(res => {
      if (res.success && res.isManagerMode) {
        _pubManagerMode = true;
        _pubMgrEntries  = res.records || [];
        _pubMgrOffset   = _pubMgrEntries.length;
        _pubMgrHasMore  = !!res.hasMore;
        if (typeof res.total === 'number') _pubTotal = res.total;
        renderPubEntriesPanel();
        loadManagerFieldCounts();
      } else {
        // Password invalidated or changed — clear session
        sessionStorage.removeItem('fbp_mgr_' + slug);
      }
    }).catch(() => {});
}

async function refreshPubEntries() {
  if (_refreshCooldownTimer) return; // already in cooldown — button shows countdown

  const btn = document.querySelector('[onclick="refreshPubEntries()"]');
  if (btn) { btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; }

  await loadPubEntries();
  toast('Entries refreshed', 'success');

  // Start 60s cooldown with live countdown on the button face
  _refreshSecsLeft = 60;
  updateRefreshBtn();

  _refreshCooldownTimer = setInterval(() => {
    _refreshSecsLeft--;
    updateRefreshBtn();
    if (_refreshSecsLeft <= 0) {
      clearInterval(_refreshCooldownTimer);
      _refreshCooldownTimer = null;
      _refreshSecsLeft = 0;
      updateRefreshBtn();
    }
  }, 1000);
}

function buildPubEntryCardHTML(r) {
  const isPublicMode = !!(window._pubFormDef && window._pubFormDef.def && window._pubFormDef.def.publicMode);
  // Not this device's entry — blurred placeholder (skip in publicMode)
  if (r.isOwn === false && !isPublicMode) {
    return `<div class="pec-row pec-row-blurred">
      <div class="pec-blur-photo"></div>
      <div class="pec-blur-content">
        <div class="pec-blur-line" style="width:68%"></div>
        <div class="pec-blur-line" style="width:45%"></div>
        <div class="pec-blur-line" style="width:58%"></div>
      </div>
      <div class="pec-blur-badge">
        <span class="pec-blur-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span class="pec-blur-text">Private</span>
      </div>
    </div>`;
  }

  const photoIdx   = _pubFields.findIndex(f => f.type && f.type.includes('FILE_UPLOAD'));
  const textFields = _pubFields.map((f,i) => ({f,i})).filter(({f}) => !f.type.includes('FILE_UPLOAD'));
  const canEdit    = !_pubLocked && (r.isOwn || isPublicMode || _pubManagerMode);

  // ── Photo source ──────────────────────────────────────
  function photoSrc() {
    if (photoIdx < 0 || !r.answers[photoIdx]) return '';
    const raw = r.answers[photoIdx];
    let fid = '';
    if (raw.includes('/file/d/')) { const m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
    else if (raw.includes('id=')) { const m = raw.match(/id=([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
    return fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w80-h100` : raw;
  }

  const src = photoSrc();
  const photoCompact = src
    ? `<div class="pec-compact-photo"><img src="${src}" alt="" onerror="this.parentNode.classList.add('pec-no-photo');this.remove()"></div>`
    : `<div class="pec-compact-photo pec-no-photo"></div>`;
  const photoExpanded = src
    ? `<div class="pec-exp-photo"><img src="${src}" alt="" onerror="this.parentNode.classList.add('pec-no-photo');this.remove()"></div>`
    : `<div class="pec-exp-photo pec-no-photo"></div>`;

  // ── Key fields for compact view ───────────────────────
  const nameField  = textFields[0];
  const compactName = nameField ? (r.answers[nameField.i] || '—') : '—';
  const subFields  = textFields.slice(1, 3);
  const compactSub = subFields.map(({f,i}) => {
    let v = r.answers[i] || '';
    if (f.type && f.type.includes('DATE')) v = normDatePub(v);
    return v;
  }).filter(Boolean).join(' · ');

  const ownChip = r.isOwn
    ? `<span class="pec-own-chip">✓ Yours</span>`
    : '';

  // ── Expanded 2-col grid (filled fields only) + compact not-filled note ──
  const filledTextFields = textFields.filter(({f,i}) => !!(r.answers[i] || '').trim());
  const emptyTextFields  = textFields.filter(({f,i}) => !(r.answers[i] || '').trim());

  const gridCells = filledTextFields.map(({f,i}) => {
    let v = r.answers[i] || '';
    if (f.type && f.type.includes('DATE')) v = normDatePub(v);
    const isFull = (f.type && f.type.includes('PARAGRAPH')) || v.length > 28;
    return `<div class="pec-exp-cell${isFull ? ' full' : ''}" style="align-self:flex-start">
      <span class="pec-exp-lbl">${f.title}</span>
      <span class="pec-exp-val">${v}</span>
    </div>`;
  }).join('');

  const notFilledNote = emptyTextFields.length
    ? `<div class="pec-not-filled-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.29 2.25h17.78A1.5 1.5 0 0 0 22.18 18L13.71 3.86a1.5 1.5 0 0 0-2.42 0Z"/></svg><span><b>Not filled:</b> ${emptyTextFields.map(({f}) => f.title).join(', ')}</span></div>`
    : '';

  const actionsHtml = canEdit ? `
    <div class="pec-exp-actions">
      <button class="pec-exp-btn-edit" onclick="event.stopPropagation();pubEditEntry(${r.row})">✏️ Edit</button>
      <button class="pec-exp-btn-del"  onclick="event.stopPropagation();pubDeleteEntry(${r.row})">🗑 Delete</button>
    </div>` : '';

  const ts = r.timestamp
    ? new Date(r.timestamp).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
      + ' · ' + new Date(r.timestamp).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:true })
    : '';

  return `<div class="pec-id-card" id="pec-${r.row}" onclick="togglePecExpand(${r.row})">
    <div class="pec-compact">
      ${photoCompact}
      <div class="pec-compact-info">
        <div class="pec-compact-name">${compactName}</div>
        ${compactSub ? `<div class="pec-compact-sub">${compactSub}</div>` : ''}
      </div>
      <div class="pec-compact-right">
        ${ownChip}
        <span class="pec-chevron">▼</span>
      </div>
    </div>
    <div class="pec-expanded">
      <div class="pec-exp-hero">
        ${photoExpanded}
        <div class="pec-exp-name-block">
          <div class="pec-exp-name">${compactName}</div>
          <div class="pec-exp-role">${ts || 'Submitted'}</div>
          ${r.isOwn ? '<div class="pec-exp-badge">✓ Your Entry</div>' : ''}
        </div>
      </div>
      <div class="pec-exp-divider"></div>
      <div class="pec-exp-grid">${gridCells}</div>
      ${notFilledNote}
      ${actionsHtml}
    </div>
  </div>`;
}

function normDatePub(v) {
  if (!v) return '';
  // GAS/JS Date.toString(): "Sun Jun 20 1999 00:00:00 GMT+0530 (India Standard Time)"
  const gasMatch = v.match(/^[A-Za-z]{3}\s+([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/);
  if (gasMatch) {
    const months = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
    const d = String(gasMatch[2]).padStart(2,'0'), m2 = months[gasMatch[1]]||'01', y = gasMatch[3];
    return `${d}/${m2}/${y}`;
  }
  // ISO: 2024-06-20 → 20/06/2024
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y,m,d]=v.split('-'); return `${d}/${m}/${y}`; }
  // Already formatted: 20/06/1999
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)) return v;
  // Timestamp number stored as string
  if (/^\d{10,13}$/.test(v)) { const dt=new Date(v.length===10?+v*1000:+v); return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`; }
  return v;
}

// ── Public form Edit ──────────────────────────────────
async function pubEditEntry(row) {
  if (_pubLocked) { toast('This form is locked. Editing is disabled.', 'error'); return; }
  // Prevent stacking modals
  if (document.querySelector('.pub-edit-backdrop') || document.querySelector('.pub-confirm-backdrop')) return;
  const rec = (_pubManagerMode ? _pubMgrEntries : _pubEntries).find(r => r.row === row);
  if (!rec) return;
  if (!rec.isOwn && !_pubManagerMode) { toast('You can only edit your own entries.', 'error'); return; }

  // Get rename field index — this field should be readonly in edit
  const _editRfi = (window._pubFormDef && window._pubFormDef.def && window._pubFormDef.def.renameFieldIndex !== undefined)
    ? window._pubFormDef.def.renameFieldIndex : -1;

  // Build edit modal
  const bd = document.createElement('div');
  bd.className = 'pub-edit-backdrop';
  bd.innerHTML = `
    <div class="pub-edit-box" style="--form-acc:${_pubAccent}">
      <div class="pub-edit-title">Edit Entry</div>
      ${_pubFields.map((f, i) => {
        const ft       = (f.type || '').toUpperCase();
        const val      = String(rec.answers[i] ?? '');
        const choices  = f.choices || [];
        const isRename = (_editRfi >= 0 && i === _editRfi);  // this field renames uploaded files

        // FILE_UPLOAD
        if (ft.includes('FILE_UPLOAD')) {
          let fid = '';
          if (val.includes('/file/d/')) { const m = val.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
          else if (val.includes('id=')) { const m = val.match(/id=([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
          const prevSrc = fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w150-h200` : val;
          const cropHint = f.cropEnabled
            ? `Will be cropped to ${f.cropWidthMm||35}×${f.cropHeightMm||45} mm`
            : 'Images only (JPG, PNG, WEBP)';
          return `<div class="pub-edit-field" id="pef-wrap-edit-${i}">
            <label class="pub-edit-label">${f.title}</label>
            ${val ? `<div id="pef-cur-${i}" style="margin-bottom:10px;display:flex;gap:10px;align-items:center">
              <img src="${prevSrc}" style="width:56px;height:72px;object-fit:cover;border-radius:7px;border:1px solid #e5e7eb" onerror="this.style.display='none'">
              <div style="font-size:.78em;color:#6b7280">Current photo<br><span style="color:#9ca3af;font-size:.9em">Upload below to replace</span></div>
            </div>` : ''}
            <div class="pub-upload-zone" id="pef-zone-${i}" style="border-color:#e5e7eb;background:#fafafa">
              <div class="uz-icon" style="font-size:1.4em">+</div>
              <div class="uz-label" style="color:#374151;font-size:.82em">${val ? 'Replace photo' : 'Choose photo'}</div>
              <div class="uz-hint" style="font-size:.72em;color:#9ca3af">${cropHint}</div>
              <input type="file" id="pef-${i}" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
            </div>
            <div id="pef-preview-${i}"></div>
          </div>`;
        }

        // DROPDOWN / LIST — handles both flat and cascading dropdowns
        if (ft.includes('LIST') || ft === 'DROPDOWN') {
          if (isRename) return `<div class="pub-edit-field"><label class="pub-edit-label">${f.title} <span style="font-size:.75em;color:#f59e0b">(locked)</span></label><input type="text" class="pub-edit-input" id="pef-${i}" value="${val}" readonly style="opacity:.6;cursor:not-allowed"></div>`;

          // Cascading: resolve available choices from parent's stored value
          let resolvedChoices = choices;
          if (f.dependsOn && f.optionsMap && Object.keys(f.optionsMap).length) {
            // Find which field is the parent and get its stored answer
            const parentIdx = _pubFields.findIndex(pf => pf.id === f.dependsOn);
            const parentVal = parentIdx >= 0 ? String(rec.answers[parentIdx] ?? '') : '';
            resolvedChoices = parentVal ? (f.optionsMap[parentVal] || []) : [];
          }

          const optsHtml = resolvedChoices.map(ch =>
            `<div class="pub-custom-opt ${val===ch?'selected':''}" data-val="${ch}" onclick="pickCustomOptEdit(${i},'${ch.replace(/'/g,"\\'")}')"> ${ch}</div>`
          ).join('');
          const isDisabled = resolvedChoices.length === 0 && f.dependsOn;
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title}</label>
            <div class="pub-custom-select">
              <div class="pef-select-trigger pub-custom-select-trigger ${val?'selected':''}" id="pef-trigger-${i}"
                onclick="${isDisabled ? '' : `openCustomSelectEdit(${i})`}"
                style="${isDisabled ? 'opacity:.45;pointer-events:none' : ''}">
                <span id="pef-label-${i}">${val || (isDisabled ? '— Select parent first —' : '— Select —')}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
              <div class="pub-custom-select-opts" id="pef-opts-${i}" style="display:none">
                ${optsHtml}
              </div>
              <input type="hidden" id="pef-${i}" value="${val}"
                data-depends-on="${f.dependsOn||''}"
                data-options-map="${f.dependsOn ? encodeURIComponent(JSON.stringify(f.optionsMap||{})) : ''}">
            </div>
          </div>`;
        }

        // RADIO / MULTIPLE CHOICE
        if (ft.includes('MULTIPLE_CHOICE') || ft === 'RADIO') {
          if (isRename) return `<div class="pub-edit-field"><label class="pub-edit-label">${f.title} <span style="font-size:.75em;color:#f59e0b">(locked)</span></label><input type="text" class="pub-edit-input" id="pef-${i}" value="${val}" readonly style="opacity:.6;cursor:not-allowed"></div>`;
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title}</label>
            <div id="pef-${i}" style="display:flex;flex-direction:column;gap:7px;margin-top:4px">
              ${choices.map((ch, ci) => `
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.88em;color:#374151">
                  <input type="radio" name="pef-radio-${i}" value="${ch}" ${val === ch ? 'checked' : ''}
                    style="accent-color:var(--form-acc,#2563eb);width:16px;height:16px">
                  ${ch}
                </label>`).join('')}
            </div>
          </div>`;
        }

        // CHECKBOX (multi-select)
        if (ft.includes('CHECKBOX')) {
          const checked = val.split(',').map(v => v.trim());
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title}</label>
            <div id="pef-${i}" style="display:flex;flex-direction:column;gap:7px;margin-top:4px">
              ${choices.map((ch, ci) => `
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.88em;color:#374151">
                  <input type="checkbox" data-pef-cb="${i}" value="${ch}" ${checked.includes(ch) ? 'checked' : ''}
                    style="accent-color:var(--form-acc,#2563eb);width:16px;height:16px">
                  ${ch}
                </label>`).join('')}
            </div>
          </div>`;
        }

        // DATE
        if (ft.includes('DATE')) {
          const dval = normDatePub(val);
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title} <span style="font-size:.78em;color:#9ca3af;font-weight:400">(DD/MM/YYYY)</span></label>
            <input type="text" id="pef-${i}" class="pub-edit-input" value="${dval}" placeholder="DD/MM/YYYY"
              inputmode="numeric" oninput="maskDate(this)" maxlength="10">
          </div>`;
        }

        // PARAGRAPH
        if (ft.includes('PARAGRAPH')) {
          if (isRename) return `<div class="pub-edit-field"><label class="pub-edit-label">${f.title} <span style="font-size:.75em;color:#f59e0b">(locked)</span></label><input type="text" class="pub-edit-input" id="pef-${i}" value="${val}" readonly style="opacity:.6;cursor:not-allowed"></div>`;
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title}</label>
            <textarea id="pef-${i}" class="pub-edit-input" style="min-height:80px;resize:vertical">${val}</textarea>
          </div>`;
        }

        // NUMBER / TEXT (default)
        const isNum = ft.includes('NUMBER');
        if (isRename) {
          return `<div class="pub-edit-field">
            <label class="pub-edit-label">${f.title}
              <span style="font-size:.75em;color:#f59e0b;font-weight:500;margin-left:6px">(used for file naming — locked)</span>
            </label>
            <input type="text" id="pef-${i}" class="pub-edit-input" value="${val}" readonly
              style="opacity:.6;cursor:not-allowed;background:#f9fafb">
          </div>`;
        }
        return `<div class="pub-edit-field">
          <label class="pub-edit-label">${f.title}</label>
          <input type="text" id="pef-${i}" class="pub-edit-input" value="${val}"
            ${isNum ? 'inputmode="numeric" pattern="[0-9]*"' : ''}>
        </div>`;
      }).join('')}
      <div class="pub-edit-actions">
        <button class="form-submit-btn" style="width:auto;padding:12px 28px;margin-top:0" id="pef-save-btn"
          onclick="pubSaveEdit(${row})">Save Changes</button>
        <button style="padding:12px 20px;border-radius:10px;font-size:.86em;font-weight:600;background:#f3f4f6;color:#374151;border:none;cursor:pointer;font-family:Plus Jakarta Sans,sans-serif"
          onclick="this.closest('.pub-edit-backdrop').remove()">Cancel</button>
      </div>
      <div id="pef-err" style="font-size:.8em;color:#e11d48;margin-top:8px;text-align:center"></div>
    </div>`;
  document.body.appendChild(bd);
  bd.onclick = e => { if (e.target === bd) bd.remove(); };

  // Attach crop listeners for file fields inside this edit modal
  window._pefCroppedFiles = window._pefCroppedFiles || {};
  _pubFields.forEach((f, i) => {
    if (!f.type || !f.type.includes('FILE_UPLOAD')) return;
    const input = document.getElementById('pef-' + i);
    if (!input) return;
    input.addEventListener('change', () => {
      const file = input.files[0];
      input.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please select an image file', 'error'); return; }
      const preview = document.getElementById('pef-preview-' + i);
      if (f.cropEnabled) {
        const wMm = +f.cropWidthMm || 35;
        const hMm = +f.cropHeightMm || 45;
        openCropModal(file, 'edit-' + i, (croppedFile) => {
          window._pefCroppedFiles['edit-' + i] = croppedFile;
          if (preview) showPefCropPreview(preview, croppedFile, i);
          // Update zone label
          const zone = document.getElementById('pef-zone-' + i);
          if (zone) zone.querySelector('.uz-label').textContent = 'Photo ready — tap to replace';
        }, wMm, hMm, !!f.cropFree);
      } else {
        // No crop — store directly
        window._pefCroppedFiles['edit-' + i] = file;
        if (preview) showPefCropPreview(preview, file, i);
      }
    });
  });
}

function showPefCropPreview(previewDiv, file, fieldIdx) {
  previewDiv.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'pub-crop-preview';
  card.style.marginTop = '8px';
  const img = document.createElement('img');
  img.alt = 'New photo';
  const reader = new FileReader();
  reader.onload = e => img.src = e.target.result;
  reader.readAsDataURL(file);
  const info = document.createElement('div');
  info.className = 'pcp-info';
  info.innerHTML = `New photo ready<span>${Math.round(file.size/1024)} KB · ${file.name.replace(/_passport\.jpg$/,'.jpg')}</span>`;
  const reBtn = document.createElement('button');
  reBtn.className = 'pcp-recrop';
  reBtn.textContent = 'Change';
  reBtn.onclick = () => { const inp = document.getElementById('pef-' + fieldIdx); if(inp) inp.click(); };
  card.appendChild(img); card.appendChild(info); card.appendChild(reBtn);
  previewDiv.appendChild(card);
}

async function pubSaveEdit(row) {
  const pwd = _pubManagerMode ? (sessionStorage.getItem('fbp_mgr_' + _pubSlug) || '') : '';
  const newValues = {};
  const rec = (_pubManagerMode ? _pubMgrEntries : _pubEntries).find(r => r.row === row);

  // ── Duplicate check on edit ───────────────────────────
  if (_pubEntries && _pubEntries.length > 0) {
    // Build a temporary entries list excluding the row being edited
    const otherEntries = _pubEntries.filter(r => r.row !== row);
    if (otherEntries.length > 0) {
      // Collect current edit field values
      const compareIdxs = _pubFields
        .map((f,i) => ({f,i}))
        .filter(({f}) => !f.type.includes('FILE_UPLOAD') && !f.type.includes('CHECKBOX'));
      const curVals = compareIdxs.map(({f,i}) => {
        const el = document.getElementById('pef-' + i);
        return pubNormForCompare(el ? el.value : '', f.type);
      });
      const dupMatches = otherEntries.filter(r =>
        compareIdxs.every(({f,i}, ci) =>
          pubNormForCompare(r.answers[i] || '', f.type) === curVals[ci]
        )
      );
      if (dupMatches.length > 0) {
        const action = await showPubDupModal(dupMatches, _pubFields);
        if (action === 'edit') {
          // Close current edit and open the duplicate entry instead
          document.querySelector('.pub-edit-backdrop')?.remove();
          setTimeout(() => pubEditEntry(dupMatches[0].row), 300);
          return;
        }
        // 'submit' → fall through to save
      }
    }
  }

  showProgress('Saving changes…', 'Please wait');
  updateProgress(10, 'Preparing…');

for (let i = 0; i < _pubFields.length; i++) {
    const f   = _pubFields[i];
    const fid = f.id || String(i);  // field ID key for v3
    const el  = document.getElementById('pef-' + i);
    if (!el) { newValues[fid] = (rec?.answers[i]) || ''; continue; }

    if (f.type && f.type.includes('FILE_UPLOAD')) {
      const editKey = 'edit-' + i;
      const croppedEdit = window._pefCroppedFiles && window._pefCroppedFiles[editKey];
      if (croppedEdit) {
        updateProgress(20, 'Uploading photo…');
        try {
          // Rename value comes from existing entry (rename field is locked in edit)
          const url = await uploadFileFrontend(croppedEdit, _pubSlug, '', (pct, sub) => updateProgress(pct, sub));
          newValues[fid] = url;
          delete window._pefCroppedFiles[editKey];
          updateProgress(90, 'Photo uploaded OK');
        } catch(e) {
          hideProgress();
          document.getElementById('pef-err').textContent = 'Upload failed: ' + e.message;
          return;
        }
      } else {
        newValues[fid] = (rec?.answers[i]) || '';
      }
    } else if (f.type && (f.type.includes('MULTIPLE_CHOICE') || f.type === 'RADIO')) {
      const checked = document.querySelector(`input[name="pef-radio-${i}"]:checked`);
      newValues[fid] = checked ? checked.value : '';
    } else if (f.type && f.type.includes('CHECKBOX')) {
      const cbs = document.querySelectorAll(`input[data-pef-cb="${i}"]:checked`);
      newValues[fid] = Array.from(cbs).map(cb => cb.value).join(', ');
    } else if (f.type && f.type.includes('DATE')) {
      newValues[fid] = el ? el.value.trim() : '';
    } else {
      newValues[fid] = el ? (el.value || '') : '';
    }
  }

  updateProgress(95, 'Saving to server…');
  try {
    const saveBtn = document.getElementById('pef-save-btn');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

    const res = await apiPost({ action: 'updateRecord', slug: _pubSlug, row, values: newValues, password: pwd, deviceId: getDeviceId() });
    hideProgress();
    if (res.success) {
      document.querySelector('.pub-edit-backdrop')?.remove();
      toast('Entry updated!', 'success');
      // Reload from server so row numbers are fresh
      await loadPubEntries();
    } else {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save Changes'; }
      const errEl = document.getElementById('pef-err');
      if (errEl) errEl.textContent = res.error || 'Failed to save';
    }
  } catch(e) {
    hideProgress();
    const saveBtn = document.getElementById('pef-save-btn');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save Changes'; }
    const errEl = document.getElementById('pef-err');
    if (errEl) errEl.textContent = 'Error: ' + e.message;
  }
}

// Re-fetch the manager's full entry list from scratch (offset 0). Used
// after a delete, since row numbers shift and local state goes stale.
async function refreshMgrEntries() {
  const pwd = sessionStorage.getItem('fbp_mgr_' + _pubSlug) || '';
  if (!pwd) return;
  try {
    const res = await api({ action: 'getManagerSubmissions', slug: _pubSlug, managerPassword: pwd, offset: 0, limit: 50 });
    if (res.success && res.isManagerMode) {
      _pubMgrEntries = res.records || [];
      _pubMgrOffset  = _pubMgrEntries.length;
      _pubMgrHasMore = !!res.hasMore;
      if (typeof res.total === 'number') _pubTotal = res.total;
      renderPubEntriesPanel();
    }
  } catch(e) {}
}

async function pubConfirmDelete(row) {
  const pwd = _pubManagerMode ? (sessionStorage.getItem('fbp_mgr_' + _pubSlug) || '') : '';
  const rec = (_pubManagerMode ? _pubMgrEntries : _pubEntries).find(r => r.row === row);

  // Prevent double-tap
  const delBtn = document.querySelector('.pub-confirm-box button');
  if (delBtn) { delBtn.disabled = true; delBtn.textContent = 'Deleting…'; }

  showProgress('Deleting entry…', 'Please wait');
  try {
    const res = await apiPost({ action: 'deleteRecord', slug: _pubSlug, row, password: pwd, deviceId: getDeviceId() });
    hideProgress();
    if (res.success) {
      document.querySelector('.pub-confirm-backdrop')?.remove();
      // Update local counters
      if (res.total !== undefined) _pubTotal = res.total; else _pubTotal = Math.max(0, _pubTotal - 1);
      if (rec && rec.isOwn) _pubOwnCount = Math.max(0, _pubOwnCount - 1);
      try {
        const rows = JSON.parse(localStorage.getItem('fbp_own_' + _pubSlug) || '[]').filter(r => r !== row);
        localStorage.setItem('fbp_own_' + _pubSlug, JSON.stringify(rows));
      } catch(e) {}
      updateCountBadges();
      toast('Entry deleted', 'success');
      // Reload from server — row numbers shift after a delete so local state is stale
      if (_pubManagerMode) await refreshMgrEntries();
      else await loadPubEntries();
    } else {
      if (delBtn) { delBtn.disabled = false; delBtn.textContent = 'Delete'; }
      const errEl = document.getElementById('pdel-err');
      if (errEl) errEl.textContent = res.error || 'Failed to delete';
    }
  } catch(e) {
    hideProgress();
    if (delBtn) { delBtn.disabled = false; delBtn.textContent = 'Delete'; }
    const errEl = document.getElementById('pdel-err');
    if (errEl) errEl.textContent = 'Error: ' + e.message;
  }
}

function renderPublicField(f, i) {
  const req   = f.required;
  const label = `<label class="form-label" for="pf-${i}">${f.title}${req ? '<span class="req">*</span>' : ''}</label>`;
  const type  = f.type || 'TEXT';

  if (type.includes('PARAGRAPH_TEXT')) {
    return `<div class="form-field" id="pf-wrap-${i}">${label}<textarea class="form-input form-textarea" id="pf-${i}" placeholder="Your answer…"></textarea></div>`;
  }
  if (type.includes('NUMBER')) {
    return `<div class="form-field" id="pf-wrap-${i}">
      ${label}
      <input class="form-input" id="pf-${i}" type="number"
        inputmode="numeric" pattern="[0-9]*"
        placeholder="Enter a number…"
        style="font-family:'JetBrains Mono',monospace;letter-spacing:.5px;font-size:.95em"
        oninput="this.value=this.value.replace(/[^0-9.]/g,'')">
    </div>`;
  }
  if (type.includes('DATE')) {
    return `<div class="form-field" id="pf-wrap-${i}">${label}<input class="form-input" id="pf-${i}" type="text" placeholder="DD/MM/YYYY" inputmode="numeric" oninput="maskDate(this)"></div>`;
  }
  if (type.includes('LIST') || type.includes('MULTIPLE_CHOICE')) {
    const isCascading = !!(f.dependsOn && f.optionsMap && Object.keys(f.optionsMap).length);
    if (isCascading) {
      // Cascading: start empty + disabled; parent's pickCustomOpt will populate it
      return `<div class="form-field" id="pf-wrap-${i}">
        ${label}
        <div class="pub-custom-select">
          <div class="pub-custom-select-trigger pf-cascade-disabled" id="pf-trigger-${i}"
            onclick="openCustomSelect(${i})" style="opacity:.45;pointer-events:none">
            <span id="pf-label-${i}">— Select ${_pubFields.find(p=>p.id===f.dependsOn)?.title||'parent'} first —</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="pub-custom-select-opts" id="pf-opts-${i}" style="display:none"></div>
          <input type="hidden" id="pf-${i}" value=""
            data-depends-on="${f.dependsOn}"
            data-options-map="${encodeURIComponent(JSON.stringify(f.optionsMap))}">
        </div>
      </div>`;
    }
    const optsHtml = (f.choices||[]).map(c =>
      `<div class="pub-custom-opt" data-val="${c}" onclick="pickCustomOpt(${i},'${c.replace(/'/g,"\\'")}')"> ${c}</div>`
    ).join('');
    return `<div class="form-field" id="pf-wrap-${i}">
      ${label}
      <div class="pub-custom-select">
        <div class="pub-custom-select-trigger" id="pf-trigger-${i}" onclick="openCustomSelect(${i})">
          <span id="pf-label-${i}">— Select an option —</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="pub-custom-select-opts" id="pf-opts-${i}" style="display:none">
          ${optsHtml}
        </div>
        <input type="hidden" id="pf-${i}" value="">
      </div>
    </div>`;
  }
  if (type.includes('CHECKBOX')) {
    const items = (f.choices||[]).map((c, ci) =>
      `<label class="form-check-item"><input type="checkbox" id="pf-cb-${i}-${ci}" value="${c}"> ${c}</label>`
    ).join('');
    return `<div class="form-field" id="pf-wrap-${i}">${label}<div class="form-check-group" id="pf-${i}">${items}</div></div>`;
  }
  if (type.includes('FILE_UPLOAD')) {
    const cropHint = f.cropEnabled
      ? `Will be cropped to ${f.cropWidthMm||35}×${f.cropHeightMm||45} mm`
      : 'Images only (JPG, PNG, WEBP)';
    return `<div class="form-field" id="pf-wrap-${i}">
      ${label}
      <div class="pub-upload-zone" id="pf-filewrap-${i}">
        <div class="uz-icon">+</div>
        <div class="uz-label">Click or tap to choose a photo</div>
        <div class="uz-hint">${cropHint}</div>
        <input type="file" id="pf-${i}" accept="image/*">
      </div>
      <div id="pf-preview-${i}"></div>
    </div>`;
  }
  return `<div class="form-field" id="pf-wrap-${i}">${label}<input class="form-input" id="pf-${i}" type="text" placeholder="Your answer…"></div>`;
}
// ── Custom dropdown for public form ──────────────────────
function openCustomSelect(idx) {
  // Close any other open dropdowns first
  document.querySelectorAll('.pub-custom-select-trigger.open').forEach(t => {
    if (t.id !== 'pf-trigger-' + idx) closeCustomSelect(parseInt(t.id.replace('pf-trigger-','')));
  });
  const trigger = document.getElementById('pf-trigger-' + idx);
  const opts    = document.getElementById('pf-opts-' + idx);
  if (!trigger || !opts) return;
  const isOpen = trigger.classList.contains('open');
  if (isOpen) { closeCustomSelect(idx); return; }
  trigger.classList.add('open');
  opts.style.display = 'block';
  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!trigger.contains(e.target) && !opts.contains(e.target)) {
        closeCustomSelect(idx);
        document.removeEventListener('click', handler);
      }
    });
  }, 0);
}

function closeCustomSelect(idx) {
  const trigger = document.getElementById('pf-trigger-' + idx);
  const opts    = document.getElementById('pf-opts-' + idx);
  if (trigger) trigger.classList.remove('open');
  if (opts)    opts.style.display = 'none';
}

function pickCustomOpt(idx, value) {
  const trigger  = document.getElementById('pf-trigger-' + idx);
  const hidden   = document.getElementById('pf-' + idx);
  const labelEl  = document.getElementById('pf-label-' + idx);
  const optsEl   = document.getElementById('pf-opts-' + idx);
  if (labelEl) { labelEl.textContent = value; }
  if (hidden)  { hidden.value = value; }
  if (trigger) { trigger.classList.add('selected'); }
  // Mark selected option
  optsEl?.querySelectorAll('.pub-custom-opt').forEach(o => {
    o.classList.toggle('selected', o.dataset.val === value);
  });
  closeCustomSelect(idx);
  // Clear error state if any
  const wrap = document.getElementById('pf-wrap-' + idx);
  if (wrap) { wrap.classList.remove('form-field-error'); const m = wrap.querySelector('.form-field-error-msg'); if(m) m.remove(); }

  // ── Cascade: update any child dropdown that depends on this field ──
  const parentFieldId = _pubFields[idx] && _pubFields[idx].id;
  if (!parentFieldId) return;
  _pubFields.forEach((cf, ci) => {
    if (!cf.dependsOn || cf.dependsOn !== parentFieldId) return;
    const childHidden  = document.getElementById('pf-' + ci);
    const childTrigger = document.getElementById('pf-trigger-' + ci);
    const childLabel   = document.getElementById('pf-label-' + ci);
    const childOpts    = document.getElementById('pf-opts-' + ci);
    if (!childHidden || !childTrigger || !childOpts) return;

    // Decode optionsMap from the hidden input's data attribute
    let optionsMap = {};
    try { optionsMap = JSON.parse(decodeURIComponent(childHidden.dataset.optionsMap || '{}')); } catch(e) {}

    const childChoices = optionsMap[value] || [];

    // Reset child selection
    childHidden.value = '';
    if (childLabel) {
      const parentTitle = _pubFields[idx].title || 'parent';
      childLabel.textContent = childChoices.length
        ? '— Select an option —'
        : `No options for "${value}"`;
    }
    childTrigger.classList.remove('selected');

    // Repopulate options
    childOpts.innerHTML = childChoices.map(c =>
      `<div class="pub-custom-opt" data-val="${c}"
        onclick="pickCustomOpt(${ci},'${c.replace(/'/g,"\\'")}')"> ${c}</div>`
    ).join('');

    // Enable or disable based on whether there are options
    if (childChoices.length) {
      childTrigger.style.opacity = '';
      childTrigger.style.pointerEvents = '';
    } else {
      childTrigger.style.opacity = '0.45';
      childTrigger.style.pointerEvents = 'none';
    }

    // Clear child's own error state
    const childWrap = document.getElementById('pf-wrap-' + ci);
    if (childWrap) { childWrap.classList.remove('form-field-error'); const m = childWrap.querySelector('.form-field-error-msg'); if(m) m.remove(); }
  });
}

function maskDate(input) {
  let v = input.value.replace(/\D/g, '').slice(0, 8);
  if (v.length > 4) v = v.replace(/(\d{2})(\d{2})(\d+)/, '$1/$2/$3');
  else if (v.length > 2) v = v.replace(/(\d{2})(\d+)/, '$1/$2');
  input.value = v;
}

// Map: field index -> cropped File (public form)
const croppedFiles = {};

function previewFile(input, i) {

function attachPublicFileHandlers() {
  if (!_pubFields) return;
  _pubFields.forEach((f, i) => {
    if (!f.type || !f.type.includes('FILE_UPLOAD')) return;
    const input = document.getElementById('pf-' + i);
    if (!input) return;
    input.addEventListener('change', () => {
      const file = input.files[0];
      input.value = ''; // allow same file re-selection
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please select an image file', 'error'); return; }
      const preview = document.getElementById('pf-preview-' + i);
      if (f.cropEnabled) {
        const wMm = +f.cropWidthMm  || 35;
        const hMm = +f.cropHeightMm || 45;
        openCropModal(file, i, (croppedFile) => {
          croppedFiles[i] = croppedFile;
          if (preview) showCropPreview(preview, croppedFile, i);
          const wrap = document.getElementById('pf-wrap-' + i);
          if (wrap) { wrap.classList.remove('form-field-error'); const msg = wrap.querySelector('.form-field-error-msg'); if (msg) msg.remove(); }
        }, wMm, hMm, !!f.cropFree);
      } else {
        // No crop — just show preview and store file
        croppedFiles[i] = file;
        if (preview) showCropPreview(preview, file, i);
        const wrap = document.getElementById('pf-wrap-' + i);
        if (wrap) { wrap.classList.remove('form-field-error'); const msg = wrap.querySelector('.form-field-error-msg'); if (msg) msg.remove(); }
      }
    });
  });
}

function showCropPreview(previewDiv, file, fieldIdx) {
  previewDiv.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'pub-crop-preview';
  const img = document.createElement('img');
  img.alt = 'Preview';
  const reader = new FileReader();
  reader.onload = e => img.src = e.target.result;
  reader.readAsDataURL(file);
  const info = document.createElement('div');
  info.className = 'pcp-info';
  info.innerHTML = `OK Passport photo ready<span>${Math.round(file.size/1024)} KB · Cropped</span>`;
  const reBtn = document.createElement('button');
  reBtn.className = 'pcp-recrop';
  reBtn.textContent = 'Crop';
  reBtn.onclick = () => {
    const input = document.getElementById('pf-' + fieldIdx);
    if (input) input.click();
  };
  card.appendChild(img); card.appendChild(info); card.appendChild(reBtn);
  previewDiv.appendChild(card);
}

async function uploadFileFrontend(file, slug, renameValue, onProgress) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        if (onProgress) onProgress(30, 'Uploading to Drive…');
        const res = await apiPost({
          action: 'uploadFile',
          dataUrl: e.target.result,
          filename: file.name,
          slug,
          renameValue: renameValue || ''
        });
        if (onProgress) onProgress(90, 'Finalising…');
        if (res.success) resolve(res.url);
        else reject(new Error(res.error || 'Upload failed'));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

// ── Verification card — shown after validation, before actual submit ──
// Reads current DOM values and shows a preview sheet.
// Returns a promise: true = user confirmed, false = user wants to edit.
function showVerifyCard(fields, slug) {
  return new Promise(resolve => {
    const theme   = (document.querySelector('.form-page') || {}).dataset?.theme || 'light';
    const formDef = window._pubFormDef;
    const orgName = (formDef && formDef.title) ? formDef.title : 'PrintoForms';
    const today   = new Date().toLocaleDateString('en-GB').split('/').reverse().join('-'); // YYYY-MM-DD

    // ── Collect values from DOM ──────────────────────────
    let photoHtml  = `<div class="vc-photo pec-no-photo"></div>`;
    let heroName   = '';
    let heroSet    = false;
    const cells    = [];

    fields.forEach((f, i) => {
      const ft  = (f.type || '').toUpperCase();
      let display = '';
      let isPhoto = false;

      if (ft.includes('FILE_UPLOAD')) {
        isPhoto = true;
        const previewImg = document.querySelector('#pf-preview-' + i + ' img');
        if (previewImg && previewImg.src) {
          photoHtml = `<div class="vc-photo"><img src="${previewImg.src}" alt="photo"></div>`;
          display = ''; // photo shown in hero, skip from grid
        } else {
          const fileEl = document.getElementById('pf-' + i);
          display = (fileEl && fileEl.files && fileEl.files[0]) ? fileEl.files[0].name : '';
          isPhoto = false; // no actual preview, show filename in grid instead
        }
        if (isPhoto) return; // photo goes to hero, not grid

      } else if (ft.includes('CHECKBOX')) {
        const checked = [];
        (f.choices || []).forEach((c, ci) => {
          const cb = document.getElementById('pf-cb-' + i + '-' + ci);
          if (cb && cb.checked) checked.push(c);
        });
        display = checked.join(', ');

      } else {
        const el = document.getElementById('pf-' + i);
        display  = el ? (el.value || '').trim() : '';
        if (ft.includes('DATE') && display) {
          try {
            const [y,m,d] = display.split('-');
            if (y && m && d) display = d + '/' + m + '/' + y;
          } catch(e) {}
        }
      }

      // First non-empty text field becomes the hero name
      if (!heroSet && display && (ft.includes('TEXT') || ft === '') && !ft.includes('FILE')) {
        heroName = display;
        heroSet  = true;
        return; // hero name shown above, skip from grid
      }

      // Decide column span: long text (paragraph / address) → full width
      const isFull = ft.includes('PARAGRAPH') || (display && display.length > 28);
      cells.push({ label: f.title, val: display, full: isFull });
    });

    const gridHtml = cells.filter(c => c.val).map(c => `
      <div class="vc-cell${c.full ? ' full' : ''}">
        <span class="vc-lbl">${c.label}</span>
        <span class="vc-val">${c.val}</span>
      </div>`).join('');

    const vcNotFilled = cells.filter(c => !c.val);
    const notFilledNoteHtml = vcNotFilled.length
      ? `<div class="vc-not-filled-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.29 2.25h17.78A1.5 1.5 0 0 0 22.18 18L13.71 3.86a1.5 1.5 0 0 0-2.42 0Z"/></svg><span><b>Not filled:</b> ${vcNotFilled.map(c => c.label).join(', ')}</span></div>`
      : '';

    // ── Build overlay ────────────────────────────────────
    const overlay = document.createElement('div');
    overlay.className = 'verify-overlay';
    overlay.innerHTML = `
      <div class="verify-card" role="dialog" aria-modal="true">

        <div class="vc-band">
          <div>
            <div class="vc-band-title">${orgName}</div>
            <div class="vc-band-sub">Review before submitting</div>
          </div>
          <div class="vc-band-logo">📋</div>
        </div>

        <div class="vc-scroll">
          <div class="vc-hero">
            ${photoHtml}
            <div class="vc-name-block">
              <div class="vc-name">${heroName || 'Review Your Details'}</div>
              <div class="vc-role">Applicant</div>
              <div class="vc-badge">✓ Ready to Submit</div>
            </div>
          </div>

          <div class="vc-divider"></div>

          <div class="vc-grid">${gridHtml}</div>
          ${notFilledNoteHtml}

          <div class="vc-strip">
            <span class="vc-ref">${today}</span>
            <span class="vc-status"><span class="vc-dot"></span>Verified</span>
          </div>
        </div>

        <div class="vc-actions">
          <button class="vc-btn-edit" id="verify-edit-btn">✏️ Edit</button>
          <button class="vc-btn-submit" id="verify-submit-btn">
            Confirm &amp; Submit
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

      </div>`;

    document.body.appendChild(overlay);

    // Focus submit for accessibility
    setTimeout(() => overlay.querySelector('#verify-submit-btn')?.focus(), 120);

    function cleanup(result) {
      overlay.style.animation = 'fadeOut .15s ease forwards';
      setTimeout(() => { if (overlay.parentNode) overlay.remove(); resolve(result); }, 140);
    }

    overlay.querySelector('#verify-edit-btn').onclick   = () => cleanup(false);
    overlay.querySelector('#verify-submit-btn').onclick = () => cleanup(true);
    overlay.addEventListener('click', e => { if (e.target === overlay) cleanup(false); });
  });
}

async function submitPublicForm(slug) {
  const fields = _pubFields || [];
  const rfi    = (window._pubFormDef && window._pubFormDef.def) ? (window._pubFormDef.def.renameFieldIndex ?? -1) : -1;

  const submitBtn0 = document.querySelector('#pub-panel-form .form-submit-btn');
  if (submitBtn0 && submitBtn0.disabled) return; // prevent double-tap

  // Validate (synchronous — no delay)
  let valid = true;
  fields.forEach((f, i) => {
    const wrap = document.getElementById('pf-wrap-' + i);
    if (wrap) { wrap.classList.remove('form-field-error'); const msg = wrap.querySelector('.form-field-error-msg'); if (msg) msg.remove(); }
    if (!f.required) return;
    const el = document.getElementById('pf-' + i);
    let hasVal = false;
    if (el && el.tagName === 'SELECT') hasVal = el.value !== '';
    else if (el && el.tagName === 'DIV') hasVal = el.querySelector('input[type=checkbox]:checked') !== null;
    else if (el && el.type === 'file') hasVal = !!croppedFiles[i] || el.files.length > 0;
    else hasVal = el && el.value.trim() !== '';
    if (!hasVal) {
      valid = false;
      if (wrap) {
        wrap.classList.add('form-field-error');
        const msg = document.createElement('div');
        msg.className = 'form-field-error-msg';
        msg.textContent = 'This field is required';
        wrap.appendChild(msg);
      }
    }
  });

  if (!valid) {
    const firstErr = document.querySelector('.form-field-error');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  // ── Verification card — show entered details before committing ──
  const confirmed = await showVerifyCard(fields, slug);
  if (!confirmed) return; // user tapped Edit — back to form

  // Start spinner immediately — pause it if a duplicate warning appears
  if (submitBtn0) { submitBtn0.disabled = true; submitBtn0.innerHTML = '<span class="spin" style="border-top-color:currentColor;width:14px;height:14px;border-width:2px"></span> Checking…'; }
  showProgress('Checking for duplicates…', 'Comparing with existing entries');
  startProgressTicker(5, 25);

  // ── Duplicate detection ───────────────────────────────
  let dupHandled = false;
  if (_pubEntries && _pubEntries.length > 0) {
    const dupMatches = await pubFindDuplicateMatches(fields);
    if (dupMatches.length > 0) {
      // Pause spinner to show warning
      hideProgress(); stopProgressTicker();
      if (submitBtn0) { submitBtn0.disabled = false; submitBtn0.innerHTML = 'Submit'; }

      const action = await showPubDupModal(dupMatches, fields);
      if (action === 'edit') {
        pubSwitchTab('entries');
        setTimeout(() => pubEditEntry(dupMatches[0].row), 300);
        return;
      }
      dupHandled = true;
    }
  }

  // ── Resume / start spinner for actual submission ──────
  const submitBtn = submitBtn0;
  if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<span class="spin" style="border-top-color:currentColor;width:14px;height:14px;border-width:2px"></span> Submitting…'; }
  if (dupHandled) { showProgress('Verifying form…', 'Checking form is still open'); }
  else { showProgress('Verifying form…', 'Checking form is still open'); updateProgress(25, 'Checking form is still open'); }
  startProgressTicker(dupHandled ? 5 : 25, 30);

  // Check lock status (quick re-verify)
  try {
    const check = await api({ action: 'getForm', slug });
    if (!check || !check.success) { hideProgress(); stopProgressTicker(); toast('Form unavailable', 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; } return; }
    if (check.locked) { hideProgress(); stopProgressTicker(); toast('This form is closed', 'error'); if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; } return; }
  } catch(e) {
    hideProgress(); stopProgressTicker();
    toast('Connection error', 'error');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; }
    return;
  }

  stopProgressTicker();
  updateProgress(30, 'Preparing upload…');
  showProgress('Uploading photo…', 'Preparing upload…');
  startProgressTicker(30, 92); // tick toward 92% while uploading / collecting

// Collect values as { fieldId: value } keyed object (v3 backend)
  const values = {};
  for (let i = 0; i < fields.length; i++) {
    const f  = fields[i];
    const fid = f.id;
    if (!fid) continue;
    const el = document.getElementById('pf-' + i);
    if (f.type && f.type.includes('FILE_UPLOAD')) {
      if (croppedFiles[i] || (el && el.files.length)) {
        try {
          const fileToUpload = croppedFiles[i] || el.files[0];
          const url = await uploadFileFrontend(fileToUpload, slug, '', () => {});
          values[fid] = url;
          delete croppedFiles[i];
        } catch (e) {
          hideProgress(); stopProgressTicker();
          toast('File upload failed: ' + e.message, 'error');
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; }
          return;
        }
      } else {
        values[fid] = '';
      }
    } else if (f.type && f.type.includes('CHECKBOX')) {
      const checked = [];
      (f.choices||[]).forEach((c, ci) => {
        const cb = document.getElementById('pf-cb-' + i + '-' + ci);
        if (cb && cb.checked) checked.push(c);
      });
      values[fid] = checked.join(', ');
    } else if (f.type && f.type.includes('DATE')) {
      values[fid] = el ? el.value.trim() : '';
    } else if (f.type && f.type.includes('NUMBER')) {
      values[fid] = el ? String(el.value).trim() : '';
    } else {
      values[fid] = el ? el.value.trim() : '';
    }
  }

  stopProgressTicker();
  showProgress('Saving entry…', 'Writing to server…');
  updateProgress(95, 'Writing to server…');

  try {
    const res = await apiPost({ action: 'submitRecord', slug, values, deviceId: getDeviceId() });
    hideProgress();
    if (res.success) {
      // Track this row as owned by this device (fallback for legacy GAS)
      if (res.row) saveDeviceOwnedRow(slug, res.row);
      // Update local counters immediately
      if (res.total) _pubTotal = res.total; else _pubTotal++;
      _pubOwnCount++;
      updateCountBadges();
      toast('Submitted successfully!', 'success');
      // Reset form fields in place — no page navigation
      fields.forEach((f, i) => {
        const el = document.getElementById('pf-' + i);
        if (!el) return;
        const ft = (f.type || '').toUpperCase();
        if (ft.includes('LIST') || ft.includes('MULTIPLE_CHOICE')) {
          // Custom dropdown reset — clear hidden input, label, and selected state
          el.value = '';
          const trigger = document.getElementById('pf-trigger-' + i);
          const labelEl = document.getElementById('pf-label-' + i);
          const optsEl  = document.getElementById('pf-opts-' + i);
          if (trigger) { trigger.classList.remove('selected', 'open'); }
          if (labelEl) { labelEl.textContent = '— Select an option —'; }
          if (optsEl)  { optsEl.querySelectorAll('.pub-custom-opt').forEach(o => o.classList.remove('selected')); optsEl.style.display = 'none'; }
        } else if (el.tagName === 'SELECT') {
          el.value = '';
        } else if (el.tagName === 'TEXTAREA') {
          el.value = '';
        } else if (el.type === 'file') {
          el.value = '';
          const prev = document.getElementById('pf-preview-' + i);
          if (prev) prev.innerHTML = '';
          // Reset upload zone label too
          const zone = document.getElementById('pf-filewrap-' + i);
          if (zone) { const lbl = zone.querySelector('.uz-label'); if (lbl) lbl.textContent = 'Click or tap to choose a photo'; }
        } else if (el.tagName === 'DIV') {
          el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
        } else {
          el.value = '';
        }
      });
      if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; }
      loadPubEntries(); // refresh entries count silently
    } else {
      toast(res.error || 'Submission failed', 'error');
      if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; }
    }
  } catch (e) {
    hideProgress();
    toast('Error: ' + e.message, 'error');
    if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = 'Submit'; }
  }
}

// ── Public form duplicate helpers ─────────────────────
async function fetchPublicDuplicates() {
  try {
    const url = GAS_URL + '?data=' + encodeURIComponent(JSON.stringify({
      action: 'getPublicDuplicates', slug: _pubSlug, deviceId: getDeviceId()
    }));
    const res  = await fetch(url, { redirect: 'follow' });
    const data = await res.json();
    if (!data.success) return { groups: [], totalDups: 0 };

    // Map backend row numbers to actual entry objects.
    // Managers need the FULL dataset (not just whatever page of
    // _pubMgrEntries happens to be loaded already) so duplicate rows
    // outside the current page still resolve to real answer data
    // instead of falling back to a blank placeholder.
    const rowMap = {};
    if (_pubManagerMode) {
      const pwd = sessionStorage.getItem('fbp_mgr_' + _pubSlug) || '';
      try {
        const mgrRes = await api({ action: 'getManagerSubmissions', slug: _pubSlug, managerPassword: pwd, offset: 0, limit: 9999 });
        if (mgrRes.success) mgrRes.records.forEach(r => { rowMap[r.row] = r; });
      } catch(e) {}
    } else {
      _pubEntries.forEach(r => { rowMap[r.row] = r; });
    }

    const groups = data.groups.map(g =>
      g.map(item => {
        const entry = rowMap[item.row] || { row: item.row, answers: [], isOwn: item.isOwn };
        return { ...entry, isOwn: item.isOwn };
      })
    );
    return { groups, totalDups: data.totalDups };
  } catch(e) {
    console.warn('Duplicate check failed:', e);
    return { groups: [], totalDups: 0 };
  }
}

function pubComputeDups(fields, entries) {
  // Match admin logic exactly:
  // - Exclude LIST, MULTIPLE_CHOICE, CHECKBOX, FILE_UPLOAD
  // - Use only first 4 fields as key
  // - Compare ALL entries (own + non-own) so cross-device dups are visible
  const keyIdxs = (fields||[])
    .map((f,i) => ({f,i}))
    .filter(({f}) => !['LIST','MULTIPLE_CHOICE','CHECKBOX','FILE_UPLOAD']
      .some(t => (f.type||'').includes(t)))
    .map(({i}) => i)
    .slice(0, 4);
  if (!keyIdxs.length) return { groups:[], totalDups:0 };
  const map = {};
  entries.forEach(r => {
    if (!r.isOwn) return; // non-own entries have blank text fields — can't compare
    const k = keyIdxs.map(i => pubNormForCompare(r.answers[i]||'', (fields[i]||{}).type||'')).join('|');
    if (!k.replace(/\|/g,'')) return;
    if (!map[k]) map[k] = [];
    map[k].push(r);
  });
  const groups = Object.values(map).filter(g => g.length > 1);
  return { groups, totalDups: groups.reduce((s,g)=>s+g.length,0) };
}
