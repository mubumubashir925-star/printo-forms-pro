function pubNormForCompare(val, fieldType) {
  // Normalise to lowercase stripped string; dates normalised to DD/MM/YYYY
  if (!val) return '';
  const v = String(val).trim().replace(/\s+/g,' ').toLowerCase();
  if (fieldType && fieldType.includes('DATE')) {
    // ISO 1999-06-20 → 20/06/1999
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y,m,d]=v.split('-'); return `${d}/${m}/${y}`; }
    // GAS date string
    const gm = v.match(/^[a-z]{3}\s+([a-z]{3})\s+(\d{1,2})\s+(\d{4})/);
    if (gm) { const mon={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'}; return `${String(gm[2]).padStart(2,'0')}/${mon[gm[1]]||'01'}/${gm[3]}`; }
    return v; // already DD/MM/YYYY
  }
  return v;
}

async function pubFindDuplicateMatches(fields) {
  // Match admin logic: exclude choice/file fields, first 4 only
  const compareIdxs = fields
    .map((f,i) => ({f,i}))
    .filter(({f}) => !['LIST','MULTIPLE_CHOICE','CHECKBOX','FILE_UPLOAD']
      .some(t => (f.type||'').includes(t)))
    .slice(0, 4);

  if (!compareIdxs.length) return [];

  const curVals = compareIdxs.map(({f,i}) => {
    const el = document.getElementById('pf-' + i);
    return pubNormForCompare(el ? el.value : '', f.type);
  });

  // Own-device matches (instant, local)
  const ownMatches = _pubEntries.filter(r => {
    return compareIdxs.every(({f,i}, ci) => {
      const stored = pubNormForCompare(r.answers[i] || '', f.type);
      return stored === curVals[ci];
    });
  }).map(r => ({ ...r, isOwn: true }));

  // Cross-device matches (server-side, full details for this one-time check)
  let otherMatches = [];
  try {
    const valuesObj = {};
    fields.forEach((f,i) => {
      const el = document.getElementById('pf-' + i);
      if (el) valuesObj[f.id] = el.value;
    });
    const url = GAS_URL + '?data=' + encodeURIComponent(JSON.stringify({
      action: 'checkSubmitDuplicate', slug: _pubSlug, values: valuesObj
    }));
    const res  = await fetch(url, { redirect: 'follow' });
    const data = await res.json();
    if (data.success && data.matches) {
      const ownRows = new Set(ownMatches.map(m => m.row));
      otherMatches = data.matches
        .filter(m => !ownRows.has(m.row))
        .map(m => ({ ...m, isOwn: false }));
    }
  } catch(e) { console.warn('Duplicate check failed:', e); }

  return [...ownMatches, ...otherMatches];
}

function showPubDupModal(matches, fields) {
  return new Promise(resolve => {
    const photoIdx = fields.findIndex(f => f.type && f.type.includes('FILE_UPLOAD'));
    const textFields = fields.map((f,i)=>({f,i})).filter(({f})=>!f.type.includes('FILE_UPLOAD'));

    // Build card HTML for each matching existing entry
    const cardsHtml = matches.map(r => {
      let thumbHtml = '';
      if (photoIdx >= 0 && r.answers[photoIdx]) {
        const raw = r.answers[photoIdx];
        let fid = '';
        if (raw.includes('/file/d/')) { const m=raw.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
        else if (raw.includes('id=')) { const m=raw.match(/id=([a-zA-Z0-9_-]+)/); if(m) fid=m[1]; }
        const src = fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w90-h115` : raw;
        thumbHtml = `<img src="${src}" onerror="this.style.display='none'" alt="" style="width:72px;height:90px;object-fit:cover;border-radius:8px;display:block">`;
      }
      const fieldsHtml = textFields.slice(0,3).map(({f,i})=>{
        let v = r.answers[i] || '—';
        if (f.type.includes('DATE')) v = normDatePub(v);
        return `<div style="margin-bottom:6px"><div style="font-size:.68em;font-weight:700;color:var(--form-acc,#2563eb);text-transform:uppercase;letter-spacing:.4px">${f.title}</div><div style="font-size:.84em;color:#1a1a1a;font-weight:500">${v}</div></div>`;
      }).join('');
      return `<div style="display:flex;gap:12px;background:#fff8ed;border:1.5px solid #fde68a;border-radius:12px;padding:14px;margin-bottom:10px">
        ${thumbHtml ? `<div style="flex-shrink:0">${thumbHtml}</div>` : ''}
        <div style="flex:1;min-width:0">${fieldsHtml}</div>
      </div>`;
    }).join('');

    const bd = document.createElement('div');
    bd.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:9500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease';
    bd.innerHTML = `
      <div style="width:100%;max-width:480px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 64px rgba(0,0,0,.25);animation:fadeUp .3s cubic-bezier(.34,1.56,.64,1) both;max-height:85vh;overflow-y:auto">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span style="font-size:1.5em">[!]</span>
          <div style="font-size:1.05em;font-weight:800;color:#1a1a1a">Possible Duplicate Found</div>
        </div>
        <div style="font-size:.83em;color:#6b7280;margin-bottom:20px">${matches.length === 1 ? 'An entry' : matches.length + ' entries'} with the same details already exist${matches.length === 1 ? 's' : ''}. Please review before submitting.</div>
        ${matches.some(m=>!m.isOwn) ? `<div style="font-size:.76em;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-bottom:14px">Note: some matches were submitted by other devices and can only be edited by an admin.</div>` : ''}
        <div style="margin-bottom:20px">${cardsHtml}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          ${matches.some(m=>m.isOwn) ? `<button id="pub-dup-edit" style="padding:11px 20px;border-radius:10px;font-size:.88em;font-weight:700;border:1.5px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;font-family:Plus Jakarta Sans,sans-serif">
            Edit Existing
          </button>` : ''}
          <button id="pub-dup-proceed" style="padding:11px 20px;border-radius:10px;font-size:.88em;font-weight:700;border:none;background:var(--form-acc,#2563eb);color:#fff;cursor:pointer;font-family:Plus Jakarta Sans,sans-serif">
            Submit Anyway →
          </button>
        </div>
      </div>`;
    document.body.appendChild(bd);

    const editBtn = bd.querySelector('#pub-dup-edit');
    if (editBtn) editBtn.onclick = () => { bd.remove(); resolve('edit'); };
    bd.querySelector('#pub-dup-proceed').onclick = () => { bd.remove(); resolve('submit'); };
    bd.onclick = e => { if (e.target === bd) { bd.remove(); resolve('edit'); } };
  });
}

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="cropContainer">
      <img id="cropImage" alt="Photo to crop" draggable="false">
      <div id="cropBox">
        <div class="crop-handle" data-h="nw"></div>
        <div class="crop-handle" data-h="n"></div>
        <div class="crop-handle" data-h="ne"></div>
        <div class="crop-handle" data-h="e"></div>
        <div class="crop-handle" data-h="se"></div>
        <div class="crop-handle" data-h="s"></div>
        <div class="crop-handle" data-h="sw"></div>
        <div class="crop-handle" data-h="w"></div>
      </div>
      <!-- Pinch / zoom guide overlay -->
      <div id="cropPinchGuide" style="
        position:absolute;
        inset:0;
        pointer-events:none;
        display:flex;
        align-items:center;
        justify-content:center;
        z-index:5;
      ">
        <div style="
          text-align:center;
          color:white;
          font-family:system-ui, sans-serif;
          background: rgba(0,0,0,0.75);
          backdrop-filter: blur(8px);
          border-radius: 12px;
          padding: 16px;
        ">
          <svg width="220" height="180" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
            <!-- FRAME -->
            <rect x="60" y="20" width="100" height="120" rx="10"
              fill="rgba(255,255,255,0.08)"
              stroke="rgba(255,255,255,0.3)" />
            <!-- CLIP AREA -->
            <clipPath id="photoClip">
              <rect x="60" y="20" width="100" height="120" rx="10"/>
            </clipPath>
            <!-- PASSPORT PHOTO -->
            <g clip-path="url(#photoClip)">
              <g>
                <!-- Background -->
                <rect x="60" y="20" width="100" height="120" fill="#dfefff"/>
                <!-- FACE -->
                <circle cx="110" cy="65" r="22" fill="#f2c9a0"/>
                <!-- BODY -->
                <rect x="85" y="85" width="50" height="45" rx="10" fill="#4a90e2"/>
                <!-- ZOOM ANIMATION -->
                <animateTransform attributeName="transform" type="scale"
                  values="1;1.35;1"
                  dur="2s"
                  repeatCount="indefinite"
                  additive="sum"
                  origin="110 80"/>
              </g>
            </g>
            <!-- LEFT FINGER -->
            <g>
              <circle r="10" fill="white" stroke="#f04400" stroke-width="2"/>
              <animateTransform attributeName="transform" type="translate"
                values="85,155;70,140;85,155"
                dur="2s" repeatCount="indefinite"/>
            </g>
            <!-- RIGHT FINGER -->
            <g>
              <circle r="10" fill="white" stroke="#f04400" stroke-width="2"/>
              <animateTransform attributeName="transform" type="translate"
                values="135,155;150,140;135,155"
                dur="2s" repeatCount="indefinite"/>
            </g>
            <!-- MAIN TEXT -->
            <text x="110" y="160" text-anchor="middle"
              font-size="13" font-weight="600" fill="white">
              Pinch to Zoom
            </text>
            <!-- SUB TEXT -->
            <text x="110" y="173" text-anchor="middle"
              font-size="10" fill="rgba(255,255,255,0.7)">
              Use two fingers or scroll
            </text>
          </svg>
        </div>
      </div>
    </div>   <!-- close #cropContainer here -->

        </button>

        </button>

    </div>

// ════════════════════════════════════════════════════
//  PASSPORT PHOTO CROP SYSTEM
// ════════════════════════════════════════════════════
const PASSPORT_RATIO = 35 / 45;   // default 3.5cm × 4.5cm
const CROP_OUT_W     = 413;       // ~300dpi
const CROP_OUT_H     = 531;

let crop = {
  displayW:0, displayH:0, baseW:0, baseH:0, scaleX:1, scaleY:1,
  box:{x:0,y:0,w:100,h:128},
  drag:null, pinch:null, onComplete:null, fieldIdx:null, originalFile:null,
  ratio: 35/45, outW: 413, outH: 531, free: false,
  zoom: 1, panX: 0, panY: 0
};

function toggleCropFree(isFree) {
  crop.free = isFree;
  document.querySelectorAll('.crop-handle[data-h="n"],.crop-handle[data-h="s"],.crop-handle[data-h="e"],.crop-handle[data-h="w"]').forEach(h => {
    h.style.display = isFree ? '' : 'none';
  });
}

// ── Zoom / Pan helpers ──
function applyImageTransform() {
  const img = document.getElementById('cropImage');
  if (!img) return;
  // transform-origin is top-left (0 0)
  img.style.transformOrigin = '0 0';
  img.style.transform = `translate(${crop.panX}px,${crop.panY}px) scale(${crop.zoom})`;
}

function clampPan(px, py) {
  // Image rendered size after zoom
  const iW = crop.baseW * crop.zoom;
  const iH = crop.baseH * crop.zoom;
  const cW = crop.displayW;
  const cH = crop.displayH;
  // Don't let image move past edges (allow negative pan up to image overhang)
  const minX = Math.min(0, cW - iW);
  const minY = Math.min(0, cH - iH);
  return {
    px: Math.max(minX, Math.min(0, px)),
    py: Math.max(minY, Math.min(0, py))
  };
}

function updateZoomSlider() {
  const sl = document.getElementById('cropZoomSlider');
  if (sl) sl.value = (crop.zoom * 100).toFixed(0);
  const lb = document.getElementById('cropZoomLabel');
  if (lb) lb.textContent = Math.round(crop.zoom * 100) + '%';
}

function setCropZoom(newZoom, pivotX, pivotY) {
  // pivotX/Y: point in container coords to zoom toward (default center)
  const cW = crop.displayW, cH = crop.displayH;
  pivotX = pivotX ?? cW / 2;
  pivotY = pivotY ?? cH / 2;
  // Current image coords at pivot
  const imgX = (pivotX - crop.panX) / crop.zoom;
  const imgY = (pivotY - crop.panY) / crop.zoom;
  newZoom = Math.max(1, Math.min(4, newZoom));
  crop.zoom = newZoom;
  // Reposition so pivot stays fixed
  let px = pivotX - imgX * newZoom;
  let py = pivotY - imgY * newZoom;
  const clamped = clampPan(px, py);
  crop.panX = clamped.px;
  crop.panY = clamped.py;
  applyImageTransform();
  updateZoomSlider();
}

function openCropModal(file, fieldIdx, onComplete, widthMm, heightMm, freeMode) {
  const wMm = widthMm  || 35;
  const hMm = heightMm || 45;
  crop.ratio = wMm / hMm;
  crop.outW  = Math.round(wMm * 11.811);  // 300dpi: 1mm = 11.811px
  crop.outH  = Math.round(hMm * 11.811);
  crop.fieldIdx = fieldIdx;
  crop.onComplete = onComplete;
  crop.originalFile = file;
  // Apply free mode from field setting
  crop.free = !!freeMode;
  // Update modal labels
  const titleEl = document.getElementById('cropModalTitle');
  const badgeEl = document.getElementById('cropBadgeLabel');
  if (titleEl) titleEl.textContent = freeMode ? 'Free Crop' : `Crop Photo`;
  if (badgeEl) badgeEl.textContent = freeMode ? 'Free crop — any size' : `${wMm}×${hMm} mm`;
  // Show/hide crop guide
  const guideWrap = document.getElementById('cropGuideWrap');
  if (guideWrap) guideWrap.style.display = 'block';
  // Show/hide edge handles based on free mode
  document.querySelectorAll('.crop-handle[data-h="n"],.crop-handle[data-h="s"],.crop-handle[data-h="e"],.crop-handle[data-h="w"]').forEach(h => {
    h.style.display = freeMode ? '' : 'none';
  });
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('cropImage');
    img.onload = () => initCropLayout(img);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  document.getElementById('cropModal').classList.add('active');
  // Show the pinch guide overlay
  const guide = document.getElementById('cropPinchGuide');
  if (guide) {
    guide.classList.remove('crop-guide-hidden');
    guide.style.display = 'flex';
  }

  // Auto‑hide after 4.5 seconds
  clearTimeout(window._cropGuideTimer);
  window._cropGuideTimer = setTimeout(() => {
    if (guide) guide.classList.add('crop-guide-hidden');
  }, 8000);

  // Also hide on first user interaction with zoom controls
  function hideGuideOnInteraction() {
    if (guide) guide.classList.add('crop-guide-hidden');
    // Remove listeners after first interaction
    const sl = document.getElementById('cropZoomSlider');
    if (sl) sl.removeEventListener('input', hideGuideOnInteraction);
    window.removeEventListener('wheel', hideGuideOnInteraction);
    document.removeEventListener('touchstart', hideGuideOnInteraction, {passive: true});
  }
  const sl = document.getElementById('cropZoomSlider');
  if (sl) sl.addEventListener('input', hideGuideOnInteraction);
  window.addEventListener('wheel', hideGuideOnInteraction);
  document.addEventListener('touchstart', hideGuideOnInteraction, {passive: true});
}  // ← closes openCropModal

function initCropLayout(img) {
  const container = document.getElementById('cropContainer');
  const maxW = Math.min(window.innerWidth - 64, 576);
  const maxH = Math.min(window.innerHeight * 0.48, 380);
  const imgRatio = img.naturalWidth / img.naturalHeight;
  let dW, dH;
  if (imgRatio > maxW / maxH) { dW = maxW; dH = maxW / imgRatio; }
  else { dH = maxH; dW = maxH * imgRatio; }
  // Set base display size (at zoom=1)
  crop.baseW = dW; crop.baseH = dH;
  crop.displayW = dW; crop.displayH = dH;
  crop.scaleX = img.naturalWidth / dW;
  crop.scaleY = img.naturalHeight / dH;
  // Reset zoom/pan
  crop.zoom = 1; crop.panX = 0; crop.panY = 0;
  // Size image and container
  img.style.width = dW + 'px'; img.style.height = dH + 'px';
  img.style.position = 'absolute'; img.style.top = '0'; img.style.left = '0';
  container.style.width = dW + 'px'; container.style.height = dH + 'px';
  applyImageTransform();
  updateZoomSlider();
  // Initial crop box
  const bH = Math.min(dH * 0.80, dW * 0.80 / crop.ratio);
  const bW = bH * (crop.free ? 1 : crop.ratio);
  crop.box = { x:(dW-bW)/2, y:(dH-bH)/2, w:bW, h:bH };
  renderCropBox();
}

function renderCropBox() {
  const el = document.getElementById('cropBox');
  const {x,y,w,h} = crop.box;
  el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=w+'px'; el.style.height=h+'px';
}

function clampCropBox({x,y,w,h}) {
  const minW=40, minH=crop.free ? 40 : minW/crop.ratio;
  w=Math.max(minW,Math.min(w,crop.displayW));
  h=Math.max(minH,Math.min(h,crop.displayH));
  x=Math.max(0,Math.min(x,crop.displayW-w));
  y=Math.max(0,Math.min(y,crop.displayH-h));
  return {x,y,w,h};
}

function getCropPointerPos(e) {
  const rect = document.getElementById('cropContainer').getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX-rect.left, y: src.clientY-rect.top };
}

function getCropAllTouches(e) {
  return Array.from(e.touches).map(t => {
    const rect = document.getElementById('cropContainer').getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  });
}

function onCropPointerDown(e) {
  e.preventDefault();
  // Pinch-to-zoom start
  if (e.touches && e.touches.length === 2) {
    const pts = getCropAllTouches(e);
    crop.pinch = { dist: Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y), zoom: crop.zoom,
      midX: (pts[0].x+pts[1].x)/2, midY: (pts[0].y+pts[1].y)/2 };
    return;
  }
  const pos = getCropPointerPos(e);
  const handle = e.target.closest && e.target.closest('.crop-handle');
  const cropBoxEl = document.getElementById('cropBox');
  const startBox = {...crop.box};
  if (handle) {
    crop.drag = {type:handle.dataset.h, startX:pos.x, startY:pos.y, startBox};
  } else if (e.target===cropBoxEl||(cropBoxEl.contains&&cropBoxEl.contains(e.target))) {
    crop.drag = {type:'move', startX:pos.x, startY:pos.y, startBox};
  } else {
    // Background: pan image
    crop.drag = {type:'pan', startX:pos.x, startY:pos.y, startPanX:crop.panX, startPanY:crop.panY};
  }
}

function onCropPointerMove(e) {
  // Pinch-to-zoom
  if (e.touches && e.touches.length === 2 && crop.pinch) {
    e.preventDefault();
    const pts = getCropAllTouches(e);
    const dist = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
    const newZoom = crop.pinch.zoom * (dist / crop.pinch.dist);
    const midX = (pts[0].x+pts[1].x)/2;
    const midY = (pts[0].y+pts[1].y)/2;
    setCropZoom(newZoom, midX, midY);
    return;
  }
  if (!crop.drag) return;
  e.preventDefault();
  const pos = getCropPointerPos(e);
  const dx=pos.x-crop.drag.startX, dy=pos.y-crop.drag.startY;
  const type=crop.drag.type;
  // Pan image
  if (type === 'pan') {
    const clamped = clampPan(crop.drag.startPanX + dx, crop.drag.startPanY + dy);
    crop.panX = clamped.px; crop.panY = clamped.py;
    applyImageTransform();
    return;
  }
  const sb=crop.drag.startBox;
  let {x,y,w,h}=sb;
  if (type==='move') { x=sb.x+dx; y=sb.y+dy; }
  else {
    let nW=w, nH=h;
    if (crop.free) {
      if      (type==='se') { nW=Math.max(40,sb.w+dx); nH=Math.max(40,sb.h+dy); }
      else if (type==='sw') { nW=Math.max(40,sb.w-dx); nH=Math.max(40,sb.h+dy); x=sb.x+sb.w-nW; }
      else if (type==='ne') { nW=Math.max(40,sb.w+dx); nH=Math.max(40,sb.h-dy); y=sb.y+sb.h-nH; }
      else if (type==='nw') { nW=Math.max(40,sb.w-dx); nH=Math.max(40,sb.h-dy); x=sb.x+sb.w-nW; y=sb.y+sb.h-nH; }
      else if (type==='e')  { nW=Math.max(40,sb.w+dx); }
      else if (type==='w')  { nW=Math.max(40,sb.w-dx); x=sb.x+sb.w-nW; }
      else if (type==='s')  { nH=Math.max(40,sb.h+dy); }
      else if (type==='n')  { nH=Math.max(40,sb.h-dy); y=sb.y+sb.h-nH; }
    } else {
      if      (type==='se') { nW=Math.max(40,sb.w+dx); nH=nW/crop.ratio; }
      else if (type==='sw') { nW=Math.max(40,sb.w-dx); nH=nW/crop.ratio; x=sb.x+sb.w-nW; }
      else if (type==='ne') { nW=Math.max(40,sb.w+dx); nH=nW/crop.ratio; y=sb.y+sb.h-nH; }
      else if (type==='nw') { nW=Math.max(40,sb.w-dx); nH=nW/crop.ratio; x=sb.x+sb.w-nW; y=sb.y+sb.h-nH; }
    }
    w=nW; h=nH;
  }
  crop.box = clampCropBox({x,y,w,h});
  renderCropBox();
}

function onCropPointerUp() { crop.drag=null; crop.pinch=null; }

function applyCrop() {
  const img = document.getElementById('cropImage');
  // Create a temporary canvas (without adding it to the DOM)
  const canvas = document.createElement('canvas');
  const { x, y, w, h } = crop.box;
  
  // Map display box coords back through pan/zoom to get natural image coords
  const natX = (x - crop.panX) / crop.zoom * crop.scaleX;
  const natY = (y - crop.panY) / crop.zoom * crop.scaleY;
  const natW = w / crop.zoom * crop.scaleX;
  const natH = h / crop.zoom * crop.scaleY;
  
  const outW = crop.free ? Math.round(w * (crop.scaleX / crop.zoom)) : crop.outW;
  const outH = crop.free ? Math.round(h * (crop.scaleY / crop.zoom)) : crop.outH;
  
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, natX, natY, natW, natH, 0, 0, outW, outH);
  
  canvas.toBlob(blob => {
    if (!blob) return;
    const filename = (crop.originalFile?.name || 'photo').replace(/\.[^.]+$/, '') + '_passport.jpg';
    const croppedFile = new File([blob], filename, { type: 'image/jpeg' });
    if (crop.onComplete) crop.onComplete(croppedFile);
    closeCropModal();
  }, 'image/jpeg', 0.92);
}

function closeCropModal() {
  document.getElementById('cropModal').classList.remove('active');
  crop.drag=null; crop.pinch=null; crop.onComplete=null;
  crop.zoom=1; crop.panX=0; crop.panY=0;
}

(function initCropEvents() {
  const container = document.getElementById('cropContainer');
  const cropBoxEl = document.getElementById('cropBox');
  // All pointer events on container (background pan + crop box move + handles)
  container.addEventListener('mousedown', onCropPointerDown);
  container.addEventListener('touchstart', onCropPointerDown, {passive:false});
  container.addEventListener('mousemove', onCropPointerMove);
  container.addEventListener('touchmove', onCropPointerMove, {passive:false});
  container.addEventListener('mouseup', onCropPointerUp);
  container.addEventListener('touchend', onCropPointerUp);
  container.addEventListener('touchcancel', onCropPointerUp);
  document.addEventListener('mouseup', onCropPointerUp);
  // Scroll-wheel zoom
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const pivotX = e.clientX - rect.left;
    const pivotY = e.clientY - rect.top;
    const delta = e.deltaY > 0 ? -0.12 : 0.12;
    setCropZoom(crop.zoom + delta, pivotX, pivotY);
  }, {passive:false});
  document.getElementById('cancelCropBtn').addEventListener('click', closeCropModal);
  document.getElementById('cancelCropBtn2').addEventListener('click', closeCropModal);
  document.getElementById('applyCropBtn').addEventListener('click', applyCrop);
  document.getElementById('cropModal').addEventListener('click', e => { if (e.target===document.getElementById('cropModal')) closeCropModal(); });
  // Zoom slider
  const sl = document.getElementById('cropZoomSlider');
  if (sl) sl.addEventListener('input', () => setCropZoom(parseInt(sl.value)/100));
})();
</script>
</body>
