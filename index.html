}
.resp-stat-pill.dup{background:rgba(239,68,68,.08);color:#f87171;border-color:rgba(239,68,68,.2)}

/* ── Form cards redesign ─── */
.form-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dash-form-card{
  background:#151827;border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:0;cursor:pointer;
  transition:all .2s ease;overflow:hidden;
}
.dash-form-card:hover{border-color:rgba(240,68,0,.3);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.form-card-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.form-card-status{
  font-size:.7em;font-weight:700;padding:3px 9px;border-radius:100px;
  text-transform:uppercase;letter-spacing:.4px;
}
.status-open{background:rgba(5,150,105,.15);color:#34d399;border:1px solid rgba(52,211,153,.25)}
.status-locked{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.form-card-body{padding:0 18px 14px}
.form-card-title{font-weight:700;font-size:1em;color:#e2e8f0;margin-bottom:4px}
.form-card-slug{font-size:.75em;color:#4a5370;font-family:'JetBrains Mono',monospace;margin-bottom:10px}
.form-card-meta{display:flex;gap:12px;font-size:.75em;color:#5a6177;border-top:1px solid rgba(255,255,255,.06);padding-top:10px;margin-bottom:12px}
.form-card-meta span{display:flex;align-items:center;gap:4px}
.form-card-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 16px}

/* ── Dashboard stats ─── */
.stat-box{
  background:#151827;border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:18px 20px;
}
.stat-num{font-size:2em;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:4px}
.stat-label{font-size:.75em;color:#5a6177;font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* ── Login page polish ─── */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#080a0f;padding:20px;
  background-image:radial-gradient(ellipse at 50% 0%, rgba(240,68,0,.06) 0%, transparent 60%);
}
.login-box{
  background:#0e1018;border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:36px 32px;width:100%;max-width:380px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
  animation:scaleIn .35s ease both;
}
.login-title{font-weight:800;font-size:1.45em;color:#fff;text-align:center;letter-spacing:-.3px;margin-bottom:4px}
.login-sub{font-family:'JetBrains Mono',monospace;font-size:.78em;color:#4a5370;text-align:center;margin-bottom:28px}

.color-swatch.active,.color-swatch:hover{border-color:#fff;transform:scale(1.12)}
.color-custom{
  width:28px;height:28px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(255,255,255,.15);padding:0;overflow:hidden;
}
input[type=color]{width:100%;height:100%;border:none;cursor:pointer;background:none;padding:0}

/* ═══════════════════════════════════════
   LOGIN — SPLIT LAYOUT
═══════════════════════════════════════ */
.login-page{background:#080a0f;min-height:100vh;display:flex;align-items:stretch;justify-content:center}
.login-split{display:flex;width:100%;max-width:960px;margin:auto;border-radius:24px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.6);animation:scaleIn .35s ease both}
.login-left{
  flex:1;padding:48px 40px;display:flex;flex-direction:column;
  background:linear-gradient(145deg,#0a1628 0%,#0d1f1a 100%);
  border-left:1px solid rgba(240,68,0,.1);
}
.login-left-logo{margin-bottom:24px}
.login-left-title{font-size:1.7em;font-weight:800;color:#fff;letter-spacing:-.4px;margin-bottom:8px}
.login-left-sub{font-size:.88em;color:#4a6580;margin-bottom:36px;line-height:1.5}
.login-features{display:flex;flex-direction:column;gap:12px;flex:1}
.login-feat{display:flex;align-items:center;gap:10px;font-size:.84em;color:#6b8a9a;font-weight:500}
.login-feat-dot{width:6px;height:6px;border-radius:50%;background:#f04400;flex-shrink:0}
.login-left-footer{font-size:.72em;color:#2a3a4a;font-family:'JetBrains Mono',monospace;margin-top:32px}
.login-right{
  width:360px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#0e1018;padding:40px 32px;
}
.login-box{width:100%}
.login-logo{
  width:52px;height:52px;border-radius:14px;
  background:rgba(240,68,0,.08);border:1px solid rgba(240,68,0,.2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.login-title{font-weight:800;font-size:1.4em;color:#fff;text-align:center;letter-spacing:-.3px;margin-bottom:4px}
.login-sub{font-size:.8em;color:#4a5370;text-align:center;margin-bottom:24px}
@media(max-width:660px){
  .login-split{flex-direction:column;border-radius:0;box-shadow:none}
  .login-right{width:100%!important;padding:32px 24px;border-bottom:1px solid rgba(240,68,0,.1)}
  .login-left{padding:28px 24px;border-left:none}
}

/* ═══════════════════════════════════════
   DASHBOARD — IMPROVED STATS
═══════════════════════════════════════ */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-box{
  background:linear-gradient(135deg,#131826 0%,#0e1118 100%);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:20px 22px;
  transition:border-color .2s ease;
}
.stat-box:hover{border-color:rgba(240,68,0,.2)}
.stat-num{font-size:2.1em;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif}
.stat-label{font-size:.72em;color:#4a5370;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-icon{font-size:1.1em;margin-bottom:8px;color:var(--acc)}

/* ═══════════════════════════════════════
   FORM CARDS — REFINED
═══════════════════════════════════════ */
.form-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dash-form-card{
  background:#111420;border:1px solid rgba(255,255,255,.07);
  border-radius:18px;overflow:hidden;cursor:pointer;
  transition:all .22s ease;display:flex;flex-direction:column;
}
.dash-form-card:hover{border-color:rgba(240,68,0,.28);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.4)}
.form-card-top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px}
.form-card-logo{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15em;font-weight:800;border:1px solid;flex-shrink:0;
}
.form-card-status{font-size:.68em;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.3px}
.status-open{background:rgba(5,150,105,.12);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.status-locked{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(248,113,113,.2)}
.form-card-body{padding:0 18px 14px;flex:1}
.form-card-title{font-weight:700;font-size:.97em;color:#e2e8f0;margin-bottom:4px;line-height:1.3}
.form-card-slug{font-size:.72em;color:#3d4560;font-family:'JetBrains Mono',monospace;margin-bottom:12px}
.form-card-meta{display:flex;gap:14px;font-size:.74em;color:#4a5370;border-top:1px solid rgba(255,255,255,.05);padding-top:11px;margin-bottom:12px}
.form-card-meta span{display:inline-flex;align-items:center}
.form-card-actions{display:flex;gap:5px;flex-wrap:wrap;padding:0 18px 16px}

/* ═══════════════════════════════════════
   ADMIN SIDEBAR — POLISH
═══════════════════════════════════════ */
.a-sidebar{
  width:230px;flex-shrink:0;
  background:linear-gradient(180deg,#0a0c14 0%,#080a10 100%);
  border-right:1px solid rgba(255,255,255,.05);
  display:flex;flex-direction:column;
  padding:20px 0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.a-brand{padding:4px 20px 22px;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:8px}
.a-brand-logo{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:.75em;font-weight:700;color:var(--acc);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.a-brand-name{font-weight:800;font-size:1.05em;color:#c8d0e0;letter-spacing:-.2px}
.a-nav{padding:6px 10px;flex:1}
.a-nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:.87em;font-weight:600;color:#5a6480;
  transition:all .18s ease;cursor:pointer;margin-bottom:2px;
}
.a-nav-item:hover{color:#c8d0e0;background:rgba(255,255,255,.04)}
.a-nav-item.active{color:var(--acc);background:rgba(240,68,0,.08);border:1px solid rgba(240,68,0,.12)}
.a-nav-item .icon{font-size:1em;width:18px;text-align:center;flex-shrink:0}
.a-sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.05);font-family:'JetBrains Mono',monospace;font-size:.72em;color:#2e3650}

/* ═══════════════════════════════════════
   PUBLIC FORM — REFINEMENTS
═══════════════════════════════════════ */
.form-page{background:#f0f2f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px 80px}
.form-header{width:100%;max-width:600px;text-align:center;margin-bottom:24px;animation:fadeUp .4s ease both}
.form-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.form-title{font-weight:800;font-size:1.75em;color:#111827;margin-bottom:6px;line-height:1.2;letter-spacing:-.3px}
.form-desc{font-size:.86em;color:#6b7280;line-height:1.65;max-width:460px;margin:0 auto}
.pub-tabs{
  width:100%;max-width:600px;display:flex;gap:0;margin-bottom:20px;
  background:#e2e5ed;border-radius:14px;padding:4px;
  animation:fadeUp .4s ease both;animation-delay:.04s;
}
.pub-tab-btn{
  flex:1;padding:10px 8px;border-radius:10px;
  font-size:.82em;font-weight:700;text-align:center;cursor:pointer;
  transition:all .2s ease;color:#6b7280;background:transparent;border:none;
  font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.1px;
}
.pub-tab-btn.active{background:#fff;color:#111827;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.form-footer{text-align:center;margin-top:32px;font-size:.76em;color:#c0c8d8;font-family:'JetBrains Mono',monospace}

/* ═══════════════════════════════════════
   ADMIN RESPONSES PAGE — TOPBAR UPDATE
═══════════════════════════════════════ */
.a-topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:14px;flex-wrap:wrap}
.a-page-title{font-weight:800;font-size:1.55em;color:#e2e8f0;letter-spacing:-.3px;line-height:1.2}
.a-page-title span{color:var(--acc)}
.a-page-sub{font-size:.8em;color:#4a5370;margin-top:4px;font-family:'JetBrains Mono',monospace}
.breadcrumb{font-size:.8em;color:#3d4560;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.breadcrumb a{color:#5a6480;cursor:pointer;text-decoration:none}
.breadcrumb a:hover{color:var(--acc)}
.breadcrumb-sep{color:#2e3650}

/* ── Dropdown filter for entries ─── */
.pub-filter-wrap{margin-bottom:14px}
.pub-filter-group{
  border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;
  margin-bottom:8px;background:#fff;
}
.pub-filter-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;user-select:none;
  font-size:.82em;font-weight:700;color:#374151;gap:8px;
}
.pub-filter-head:hover{background:#f9fafb}
.pub-filter-head-icon{flex-shrink:0;transition:transform .2s ease;color:#9ca3af}
.pub-filter-head-icon.open{transform:rotate(180deg)}
.pub-filter-pills{
  display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;
  animation:fadeUp .18s ease both;
}
.pub-filter-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:100px;border:1.5px solid #e5e7eb;
  font-size:.78em;font-weight:600;cursor:pointer;
  background:#fff;color:#374151;transition:all .15s ease;
  user-select:none;-webkit-user-select:none;
}
.pub-filter-pill:hover{border-color:#9ca3af;background:#f3f4f6}
.pub-filter-pill.active{color:#fff;border-color:var(--filter-acc,#2563eb);background:var(--filter-acc,#2563eb)}
.pub-filter-pill .pfc{font-size:.85em;opacity:.7;font-weight:500}
.pub-filter-reset{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:100px;font-size:.78em;font-weight:700;
  background:#fef2f2;color:#dc2626;border:1px solid #fecaca;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:all .15s ease;
}
.pub-filter-reset:hover{background:#fee2e2}
.pub-filter-active-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;
  padding:8px 12px;margin-bottom:12px;font-size:.78em;font-weight:600;color:#1d4ed8;
}
/* Dark mode filter */
.form-page[data-theme="dark"] .pub-filter-group{background:#1a1f2e;border-color:rgba(255,255,255,.08)}
.form-page[data-theme="dark"] .pub-filter-head{color:#c8d0e0}
.form-page[data-theme="dark"] .pub-filter-head:hover{background:rgba(255,255,255,.03)}
.form-page[data-theme="dark"] .pub-filter-pill{background:#252a3a;border-color:rgba(255,255,255,.1);color:#c8d0e0}
.form-page[data-theme="dark"] .pub-filter-pill:hover{background:#2e3547}
.form-page[data-theme="dark"] .pub-filter-pill.active{
  color:#fff !important;
  background:var(--filter-acc,#2563eb) !important;
  border-color:var(--filter-acc,#2563eb) !important;
  box-shadow:0 0 0 2px rgba(var(--filter-acc-rgb,37,99,235),.25);
}
.form-page[data-theme="dark"] .pub-filter-active-bar{background:rgba(37,99,235,.1);border-color:rgba(96,165,250,.25);color:#60a5fa}
/* ── Custom Dropdown (public form) ────────────────────────── */
.pub-custom-select{position:relative;width:100%;user-select:none}
.pub-custom-select-trigger{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:10px;
  border:1.5px solid #e5e7eb;background:#fafafa;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:.9em;color:#9ca3af;
  cursor:pointer;transition:all .2s ease;
}
.pub-custom-select-trigger.selected{color:#111827}
.pub-custom-select-trigger:hover{border-color:#d1d5db;background:#fff}
.pub-custom-select-trigger.open{
  border-color:var(--form-acc,#2563eb);background:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
  border-radius:10px 10px 0 0;
}
.pub-custom-select-trigger svg{flex-shrink:0;transition:transform .2s ease;color:#9ca3af}
.pub-custom-select-trigger.open svg{transform:rotate(180deg)}
.pub-custom-select-opts{
  position:absolute;top:100%;left:0;right:0;z-index:999;
  background:#fff;border:1.5px solid var(--form-acc,#2563eb);
  border-top:none;border-radius:0 0 10px 10px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  max-height:220px;overflow-y:auto;
  /* No animation — transform-based animation causes full-page repaint on mobile */
}
.pub-custom-opt{
  padding:11px 14px;font-size:.9em;color:#374151;cursor:pointer;
  transition:background .12s ease;display:flex;align-items:center;gap:10px;
}
.pub-custom-opt:hover{background:#f0f4ff}
.pub-custom-opt.selected{
  background:#eff6ff;color:var(--form-acc,#2563eb);font-weight:600;
}
.pub-custom-opt.selected::after{
  content:'✓';margin-left:auto;font-size:.85em;
}
/* dark mode */
.form-page[data-theme="dark"] .pub-custom-select-trigger{background:#1e2230;border-color:rgba(255,255,255,.1);color:#4b5268}
.form-page[data-theme="dark"] .pub-custom-select-trigger.selected{color:#e8ecf4}
.form-page[data-theme="dark"] .pub-custom-select-trigger:hover{background:#252a3a;border-color:rgba(255,255,255,.2)}
.form-page[data-theme="dark"] .pub-custom-select-trigger.open{background:#252a3a}
.form-page[data-theme="dark"] .pub-custom-select-opts{background:#1e2230;border-color:var(--form-acc,#2563eb)}
.form-page[data-theme="dark"] .pub-custom-opt{color:#c8d0e0}
.form-page[data-theme="dark"] .pub-custom-opt:hover{background:rgba(37,99,235,.15)}
.form-page[data-theme="dark"] .pub-custom-opt.selected{background:rgba(37,99,235,.2);color:#93c5fd}
/* error state */
.form-field-error .pub-custom-select-trigger{border-color:#ef4444!important;background:#fff5f5}
/* ── Date filter ───────────────────────────────────────────── */
.pub-date-filter-pills{
  display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;
  animation:fadeUp .18s ease both;
}
.pub-date-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:100px;border:1.5px solid #e5e7eb;
  font-size:.78em;font-weight:600;cursor:pointer;
  background:#fff;color:#374151;transition:all .15s ease;
  user-select:none;-webkit-user-select:none;
}
.pub-date-pill:hover{border-color:#9ca3af;background:#f3f4f6}
.pub-date-pill.active{color:#fff;border-color:var(--filter-acc,#2563eb);background:var(--filter-acc,#2563eb)}
.pub-date-range-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 14px 12px;
  animation:fadeUp .18s ease both;
}
.pub-date-range-row label{font-size:.74em;font-weight:600;color:#6b7280;white-space:nowrap}
.pub-date-input{
  padding:6px 10px;border-radius:8px;border:1.5px solid #d1d5db;
  background:#fff;color:#374151;font-family:inherit;font-size:.78em;
  outline:none;cursor:pointer;transition:all .15s ease;
}
.pub-date-input:focus{border-color:var(--filter-acc,#2563eb);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.pub-date-apply-btn{
  padding:6px 14px;border-radius:8px;
  background:var(--filter-acc,#2563eb);color:#fff;
  font-size:.78em;font-weight:700;cursor:pointer;border:none;
  font-family:inherit;transition:opacity .15s ease;white-space:nowrap;
}
.pub-date-apply-btn:hover{opacity:.88}
.pub-date-apply-btn:disabled{opacity:.4;cursor:not-allowed}
/* dark mode date filter */
.form-page[data-theme="dark"] .pub-date-pill{background:#252a3a;border-color:rgba(255,255,255,.1);color:#c8d0e0}
.form-page[data-theme="dark"] .pub-date-pill:hover{background:#2e3547}
.form-page[data-theme="dark"] .pub-date-pill.active{color:#fff !important;background:var(--filter-acc,#2563eb) !important;border-color:var(--filter-acc,#2563eb) !important}
.form-page[data-theme="dark"] .pub-date-range-row label{color:#8891a8}
.form-page[data-theme="dark"] .pub-date-input{background:#1e2230;border-color:rgba(255,255,255,.12);color:#e8ecf4}
.form-page[data-theme="dark"] .pub-date-input:focus{border-color:var(--filter-acc,#2563eb);box-shadow:0 0 0 3px rgba(37,99,235,.15)}

/* ═══════════════════════════════════════
   MOBILE OVERRIDES — must come LAST to
   override the above desktop definitions
═══════════════════════════════════════ */
@media(max-width:768px){
  .mobile-topbar{display:flex}
  .a-shell{display:block}
  .a-sidebar{
    position:fixed!important;top:0;left:0;bottom:0;z-index:8000;
    height:100%!important;width:240px;overflow-y:auto;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .a-sidebar.open{transform:translateX(0)}
  .a-main{padding:16px!important}
  .a-topbar{flex-direction:column;align-items:flex-start;gap:10px}
  .stats-row{grid-template-columns:1fr 1fr}
  .form-cards{grid-template-columns:1fr}
  .form-card-actions{flex-direction:row}
}
@media(max-width:480px){
  .a-main{padding:12px!important}
}
</style>

<body>

async function api(payload) {
  const url = GAS_URL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  const res  = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error('Invalid JSON: ' + text.slice(0, 120)); }
}

// POST API — for large payloads (file uploads, etc.)
// GAS requires Content-Type: text/plain to avoid CORS preflight
async function apiPost(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error('Invalid JSON: ' + text.slice(0, 120)); }
}

// Smoothly tick progress from `from` to `to` over time, updating every ~80ms
// Simulates a natural "loading counter" feel
let _tickerTimer = null;
function startProgressTicker(from, to, stepInterval = 80) {
  if (_tickerTimer) { clearInterval(_tickerTimer); _tickerTimer = null; }
  let cur = from;
  updateProgress(cur);
  _tickerTimer = setInterval(() => {
    const remaining = to - cur;
    if (remaining <= 0) { clearInterval(_tickerTimer); _tickerTimer = null; return; }
    // Decelerate as we approach target (easing)
    const step = Math.max(0.3, remaining * 0.07);
    cur = Math.min(to, cur + step);
    updateProgress(Math.round(cur));
  }, stepInterval);
}
function stopProgressTicker() {
  if (_tickerTimer) { clearInterval(_tickerTimer); _tickerTimer = null; }
}

  el.style.opacity = '0';

function slugify(str) {
  return str.toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .slice(0, 50);
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString(undefined, { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function pad2(n) { return String(n).padStart(2,'0'); }
function normalizeDate(val) {
  if (!val) return '';
  // Real Date object
  if (Object.prototype.toString.call(val) === '[object Date]') {
    if (isNaN(val)) return '';
    return pad2(val.getDate()) + '/' + pad2(val.getMonth()+1) + '/' + val.getFullYear();
  }
  if (typeof val !== 'string') return String(val);
  val = val.trim();
  // Already DD/MM/YYYY
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(val)) return val;
  // ISO: 2024-06-20
  if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
    const [y,m,d] = val.split('-'); return `${d}/${m}/${y}`;
  }
  // Date.toString() style: "Sun Jun 20 1999 00:00:00 GMT+0530 (India Standard Time)"
  if (val.includes('GMT') || val.includes('UTC') || /^[A-Za-z]{3}\s+[A-Za-z]{3}\s+\d/.test(val)) {
    const cleaned = val.replace(/\(.*?\)/g,'').trim();
    const dt = new Date(cleaned);
    if (!isNaN(dt)) return pad2(dt.getDate()) + '/' + pad2(dt.getMonth()+1) + '/' + dt.getFullYear();
  }
  // Timestamp number as string
  if (/^\d{10,}$/.test(val)) {
    const dt = new Date(Number(val));
    if (!isNaN(dt)) return pad2(dt.getDate()) + '/' + pad2(dt.getMonth()+1) + '/' + dt.getFullYear();
  }
  return val;
}

function getDriveThumb(url) {
  if (!url) return '';
  let id = '';
  const m1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m1) id = m1[1];
  else if (m2) id = m2[1];
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w110-h140` : url;
}

async function doLogin() {
  const pw  = document.getElementById('l-pw').value.trim();
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('login-err');
  const bar = document.getElementById('login-progress-bar');
  if (!pw) { document.getElementById('l-pw').focus(); return; }
  err.style.display = 'none';
  btn.innerHTML = '<span class="spin"></span> Verifying…';
  btn.disabled = true;
  // Animate progress bar
  if (bar) {
    bar.style.display = 'block';
    bar.querySelector('.lpb-fill').style.width = '0%';
    setTimeout(() => { bar.querySelector('.lpb-fill').style.width = '40%'; }, 50);
    setTimeout(() => { bar.querySelector('.lpb-fill').style.width = '70%'; }, 600);
    setTimeout(() => { bar.querySelector('.lpb-fill').style.width = '88%'; }, 1400);
  }
  try {
    const res = await api({ action: 'verifyAdmin', password: pw });
    if (res.success) {
      if (bar) { bar.querySelector('.lpb-fill').style.width = '100%'; bar.querySelector('.lpb-fill').style.background = '#22c55e'; }
      S.session = true; S.password = pw;
      sessionStorage.setItem('fbp_auth', '1');
      sessionStorage.setItem('fbp_pw', pw);
      // Force route even if hash is already #/admin (mobile hashchange bug)
      if (location.hash === '#/admin' || location.hash === '' || location.hash === '#') {
        location.hash = '#/admin';
        route();
      } else {
        go('#/admin');
      }
    } else {
      if (bar) { bar.querySelector('.lpb-fill').style.width = '100%'; bar.querySelector('.lpb-fill').style.background = '#ef4444'; setTimeout(()=>{bar.style.display='none';},500); }
      err.textContent = 'x Incorrect password. Please try again.';
      err.style.display = 'block';
      btn.innerHTML = 'Access Admin Panel →'; btn.disabled = false;
      document.getElementById('l-pw').value = '';
      document.getElementById('l-pw').focus();
    }
  } catch (e) {
    if (bar) { bar.style.display = 'none'; }
    err.textContent = ' Connection error — check GAS_URL in config.';
    err.style.display = 'block';
    btn.innerHTML = 'Access Admin Panel →'; btn.disabled = false;
  }
}

let _dashStatusFilter = 'all';

function dashSetFilter(status) {
  _dashStatusFilter = status;
  ['all','active','locked'].forEach(s => {
    const el = document.getElementById('df-' + s);
    if (el) el.classList.toggle('active', s === status);
  });
  dashFilterForms(document.getElementById('dash-search')?.value || '');
}

function dashFilterForms(q) {
  const query = (q || '').toLowerCase().trim();
  let forms = S.forms;
  // Status filter
  if (_dashStatusFilter === 'active') forms = forms.filter(f => !f.locked);
  if (_dashStatusFilter === 'locked') forms = forms.filter(f =>  f.locked);
  // Search filter
  if (query) forms = forms.filter(f =>
    f.title.toLowerCase().includes(query) ||
    f.slug.toLowerCase().includes(query)
  );

  const container = document.getElementById('dash-forms');
  if (!container) return;

  if (!forms.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
        <div class="empty-text">${query ? 'No forms matching "' + q + '"' : 'No forms yet. Create your first form.'}</div>
      </div>`;
    return;
  }

  renderFormCards(forms);
}

function renderDashContent() {
  const forms    = S.forms;
  const total    = forms.length;
  const subs     = forms.reduce((s, f) => s + (f.count || 0), 0);

async function openFormSheet(slug) {
  try {
    const res = await api({ action: 'getSheetUrl', slug });
    if (res.success && res.url) {
      window.open(res.url, '_blank');
    } else {
      toast('Could not get sheet URL', 'error');
    }
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
}
function copyLink(slug) {
  const origin = location.origin + location.pathname.replace(/index\.html$/, '');
  const link   = origin + '#/form/' + slug;
  navigator.clipboard.writeText(link).then(() => toast('Link copied: ' + link, 'success'));
}

async function toggleFormLock(slug, currentLocked) {
  showProgress(currentLocked ? 'Unlocking form…' : 'Locking form…', 'Updating on server');
  updateProgress(30, 'Connecting…');
  try {
    const res = await api({ action: 'toggleLock', slug, locked: !currentLocked, password: S.password });
    hideProgress();
    if (res.success) { toast(currentLocked ? 'Form unlocked' : 'Form locked', 'success'); renderDashboard(); }
    else toast(res.error, 'error');
  } catch (e) { hideProgress(); toast('Error: ' + e.message, 'error'); }
}

function deleteFormConfirm(slug, title) {
  confirm(`Delete "${title}"?`, 'This removes the form definition. Submitted data is kept safe in the sheet.', async () => {
    showProgress('Deleting form…', 'Please wait');
    updateProgress(30, 'Removing…');
    try {
      const res = await api({ action: 'deleteForm', slug, password: S.password });
      hideProgress();
      if (res.success) { toast('Form deleted', 'info'); renderDashboard(); }
      else toast(res.error, 'error');
    } catch (e) { hideProgress(); toast('Error: ' + e.message, 'error'); }
  });
}

// Generate initials from title (e.g., "Parent Name" -> "PN")
function getInitials(title) {
  if (!title) return '??';
  const words = title.trim().split(/\s+/).filter(w => w.length > 0);
  if (words.length === 0) return '??';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

// Deterministic color generator - same title always produces same color
function getColorForTitle(title) {
  const colors = [
    '#2563eb', // blue
    '#7c3aed', // purple
    '#059669', // green
    '#e11d48', // red
    '#ea580c', // orange
    '#0891b2', // cyan
    '#9333ea', // violet
    '#dc2626', // crimson
    '#0284c7', // sky
    '#16a34a', // emerald
  ];
  let hash = 0;
  for (let i = 0; i < title.length; i++) {
    hash = ((hash << 5) - hash) + title.charCodeAt(i);
    hash |= 0;
  }
  return colors[Math.abs(hash) % colors.length];
}

}

let _editPresetIdx = -1;

function openPresetModal(idx) {
  _editPresetIdx = idx !== undefined ? idx : -1;
  const modal = document.getElementById('preset-modal');
  if (!modal) return;
  modal.style.display = 'flex';

  if (_editPresetIdx >= 0) {
    const p = getPresets()[_editPresetIdx];
    document.getElementById('preset-modal-title').textContent = 'Edit Preset';
    document.getElementById('pm-icon').value    = p.icon || '';
    document.getElementById('pm-title').value   = p.title || '';
    document.getElementById('pm-type').value    = p.type || 'text';
    document.getElementById('pm-required').checked = !!p.required;
    document.getElementById('pm-choices').value = (p.choices||[]).join('\n');
  } else {
    document.getElementById('preset-modal-title').textContent = 'New Preset';
    document.getElementById('pm-icon').value    = '';
    document.getElementById('pm-title').value   = '';
    document.getElementById('pm-type').value    = 'text';
    document.getElementById('pm-required').checked = false;
    document.getElementById('pm-choices').value = '';
  }
  updatePresetChoicesVisibility();
}

function closePresetModal() {
  const modal = document.getElementById('preset-modal');
  if (modal) modal.style.display = 'none';
}

function updatePresetChoicesVisibility() {
  const type = document.getElementById('pm-type')?.value || '';
  const wrap = document.getElementById('pm-choices-wrap');
  if (wrap) wrap.style.display = ['dropdown','radio','checkbox'].includes(type) ? '' : 'none';
}

function savePresetFromModal() {
  const title = (document.getElementById('pm-title')?.value || '').trim();
  if (!title) { alert('Please enter a field label.'); return; }
  const type     = document.getElementById('pm-type')?.value || 'text';
  const required = document.getElementById('pm-required')?.checked || false;
  const iconVal  = (document.getElementById('pm-icon')?.value || '').trim();
  // Only store icon if user provided one; empty string means use auto-initials
  const icon     = iconVal !== '' ? iconVal : '';
  const choicesRaw = document.getElementById('pm-choices')?.value || '';
  const choices  = ['dropdown','radio','checkbox'].includes(type)
    ? choicesRaw.split('\n').map(c=>c.trim()).filter(Boolean)
    : [];

  const preset = { icon, title, type, required, choices };
  const list   = getPresets();

  if (_editPresetIdx >= 0) {
    list[_editPresetIdx] = preset;
  } else {
    list.push(preset);
  }
  savePresets(list);
  closePresetModal();
  renderPresets();
}

function deletePreset(idx) {
  const list = getPresets();
  const name = list[idx]?.title || 'this preset';
  if (!window.confirm('Delete preset "' + name + '"?')) return;
  list.splice(idx, 1);
  savePresets(list);
  renderPresets();
}

function addFieldFromPreset(idx) {
  const preset = getPresets()[idx];
  if (!preset) return;
  S.editFields.forEach(f => { f.expanded = false; });
  S.editFields.push({
    id:       'fld_' + Date.now(),
    title:    preset.title,
    type:     preset.type,
    required: preset.required,
    choices:  [...(preset.choices || [])],
    dependsOn:  '',
    optionsMap: {},
    expanded: true
  });
  document.getElementById('preset-picker-panel').style.display = 'none';
  renderFieldsList();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.field-title-input');
    if (inputs.length) inputs[inputs.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}
function addField() {
  // Adding at end is always safe — never blocked
  S.editFields.forEach(f => { f.expanded = false; });
  S.editFields.push({ id: 'fld_' + Date.now(), title: '', type: 'text', required: false, choices: [], dependsOn: '', optionsMap: {}, expanded: true });
  renderFieldsList();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.field-title-input');
    if (inputs.length) inputs[inputs.length - 1].focus();

function removeField(i) {
  if (S.structSafeMode) {
    confirm(
      'Delete field — sheet impact',
      `Deleting "${S.editFields[i].title || 'this field'}" will shift all subsequent columns in the spreadsheet. Existing responses will show wrong data under those fields. Are you sure?`,
      () => { S.editFields.splice(i, 1); renderFieldsList(); },
      true
    );
    return;
  }
  S.editFields.splice(i, 1);
  renderFieldsList();
}

function moveField(i, dir) {
  if (S.structSafeMode) {
    const targetName = S.editFields[i + dir]?.title || 'adjacent field';
    confirm(
      'Move field — sheet impact',
      `Moving "${S.editFields[i].title || 'this field'}" will swap column positions in the spreadsheet. Existing responses may appear under wrong field headings. Continue?`,
      () => {
        const j = i + dir;
        if (j < 0 || j >= S.editFields.length) return;
        [S.editFields[i], S.editFields[j]] = [S.editFields[j], S.editFields[i]];
        renderFieldsList();
      },
      true
    );
    return;
  }
  const j = i + dir;
  if (j < 0 || j >= S.editFields.length) return;
  [S.editFields[i], S.editFields[j]] = [S.editFields[j], S.editFields[i]];
  renderFieldsList();
}

function toggleFieldExpand(i) {
  const isExpanded = S.editFields[i].expanded;
  // Accordion: collapse all, then open only the clicked one (unless it was already open)
  S.editFields.forEach((f, idx) => { f.expanded = false; });
  if (!isExpanded) S.editFields[i].expanded = true;
  renderFieldsList();
  // Scroll the newly opened card into view
  if (!isExpanded) {
    setTimeout(() => {
      const cards = document.querySelectorAll('.field-item');
      if (cards[i]) cards[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function updateField(i, key, value) {
  S.editFields[i][key] = value;
  if (key === 'type') renderFieldsList(); // re-render to show/hide choices
  // When dependsOn changes, reset the optionsMap so stale data doesn't carry over
  if (key === 'dependsOn') {
    S.editFields[i].optionsMap = {};
    S.editFields[i].choices    = [];
  }
}

// Update one parent-choice slice of the cascading options map
function updateCascadeMap(fieldIdx, parentChoice, rawText) {
  if (!S.editFields[fieldIdx].optionsMap) S.editFields[fieldIdx].optionsMap = {};
  const vals = rawText.split('\n').map(s => s.trim()).filter(Boolean);
  if (vals.length) {
    S.editFields[fieldIdx].optionsMap[parentChoice] = vals;
  } else {
    delete S.editFields[fieldIdx].optionsMap[parentChoice];
  }
}

                  <input class="a-input" type="number" min="5" max="300" placeholder="45" value="${f.cropHeightMm||45}" style="height:38px"
                    oninput="S.editFields[${i}].cropHeightMm=+this.value||45">
                </div>
                <div style="font-size:.74em;color:#5a6177;padding-bottom:10px;white-space:nowrap">at 300 dpi</div>
              </div>
              <div class="a-hint">Default: 35×45mm (passport size). User crops to this ratio.</div>
              ` : `<div class="a-hint" style="margin-top:6px">User can crop freely to any size.</div>`}
              ` : ''}
              <div class="a-hint" style="margin-top:6px">Uploaded files saved to Drive → <strong>${(document.getElementById('b-slug') || {value:'[slug]'}).value || '[slug]'}</strong>/</div>
            ` : ''}
          </div>` : ''}
        </div>`;
    }).join('');
  }

  renderRenameSection();
}

function renderRenameSection() { /* removed — rename handled in photo download modal */ }

async function saveForm(existingSlug) {
  const title  = document.getElementById('b-title').value.trim();
  const slug   = existingSlug || document.getElementById('b-slug').value.trim();
  const desc   = document.getElementById('b-desc').value.trim();
  const logo   = document.getElementById('b-logo').value.trim();
  const accent = document.getElementById('b-accent').value;
  const hideBranding = document.getElementById('b-hide-branding').checked;

  if (!title) { toast('Please enter a form title', 'error'); document.getElementById('b-title').focus(); return; }
  if (!slug && !existingSlug) { toast('Please enter a URL slug', 'error'); document.getElementById('b-slug').focus(); return; }
  if (!S.editFields.length) { toast('Add at least one field', 'error'); return; }
  if (S.editFields.some(f => !f.title.trim())) { toast('All fields must have a name', 'error'); return; }

  const payload = {
    action: existingSlug ? 'updateForm' : 'createForm',
    password: S.password,
    slug,
    title,
    description: desc,
    fields: S.editFields.map((f, fi) => ({
      id: f.id || ('fld_' + (Date.now() + fi)),
      title: f.title.trim(),
      type: f.type.toUpperCase().replace('PARAGRAPH', 'PARAGRAPH_TEXT').replace('DROPDOWN', 'LIST').replace('RADIO', 'MULTIPLE_CHOICE').replace('CHECKBOX', 'CHECKBOX').replace('DATE', 'DATE').replace('FILE', 'FILE_UPLOAD').replace('NUMBER', 'NUMBER').replace('TEXT', 'TEXT'),
      required: !!f.required,
      choices: f.choices || [],
      dependsOn:  f.dependsOn  || '',       // field ID this dropdown depends on
      optionsMap: f.optionsMap || {},       // { parentChoice: [childChoices] }
      cropEnabled: !!f.cropEnabled,
      cropFree: !!f.cropFree,
      cropWidthMm: f.cropEnabled ? (+f.cropWidthMm||35) : 35,
      cropHeightMm: f.cropEnabled ? (+f.cropHeightMm||45) : 45
    })),
    renameFieldId: '',
    logoText: logo,
    accentColor: accent,
    hideBranding: hideBranding,
    publicMode:   document.getElementById('b-public-mode').checked,
    ...(((document.getElementById('b-manager-pwd') || {}).value || '').trim()
      ? { managerPassword: document.getElementById('b-manager-pwd').value.trim() }
      : {}  // empty field = don't overwrite existing password
    )
  };

  const btn = document.querySelector('.a-main .btn-primary-a');
  if (btn) { btn.innerHTML = '<span class="spin"></span> Saving…'; btn.disabled = true; }
  showProgress(existingSlug ? 'Updating form…' : 'Creating form…', 'Saving to server');

  try {
    const res = await apiPost(payload);
    hideProgress();
    if (res.success) {
      toast(existingSlug ? 'Form updated successfully' : 'Form created!', 'success');
      go('#/admin');
    } else {
      toast(res.error || 'Failed to save', 'error');
      if (btn) { btn.innerHTML = existingSlug ? 'Save Changes' : 'Create Form'; btn.disabled = false; }
    }
  } catch (e) {
    hideProgress();
    toast('Error: ' + e.message, 'error');
    if (btn) { btn.innerHTML = existingSlug ? 'Save Changes' : 'Create Form'; btn.disabled = false; }
  }
}

    if (sRes.success) {
      S.submissions = sRes.records || [];
      S.subOffset   = S.submissions.length;
      S.subHasMore  = !!sRes.hasMore;
      S.subTotal    = sRes.total || S.submissions.length;
      S.searchActive  = false;
      S.searchResults = [];

  try {

      const pillEl = document.getElementById('admin-dup-pill');
      if (pillEl) pillEl.outerHTML = adminDupPillHtml(freshGroups, slug);
    }
  } catch(e) { /* silent — pill stays with client-side count if server fails */ }
}

let _adminSearchTimer = null;
function adminSearchInput(val, slug) {
  S.searchQ = val;
  clearTimeout(_adminSearchTimer);
  if (!val.trim()) {
    // Empty — just re-filter the loaded page instantly, no API call needed
    renderResponseCards(slug);
    return;
  }
  // Non-empty — debounce only to avoid hammering the server mid-keystroke,
  // then call the server to search ALL rows (not just the loaded 50)
  _adminSearchTimer = setTimeout(() => adminSearchServer(val.trim(), slug), 350);
}

async function adminSearchServer(q, slug) {
  const inp = document.getElementById('resp-search');
  if (inp) inp.style.opacity = '0.5';
  try {
    const res = await api({ action: 'searchSubmissions', slug, query: q });
    if (res.success) {
      S.searchResults = res.records || [];
      S.searchActive  = true;
    }
  } catch(e) { /* silently fall back to local results */ }
  if (inp) inp.style.opacity = '1';
  renderResponseCards(slug);
}

function renderResponseCards(slug) {
  const fields  = S.currentForm && S.currentForm.def ? S.currentForm.def.fields || [] : [];
  const q       = (S.searchQ || '').toLowerCase();
  const dups    = computeDuplicates(S.submissions, fields);
  const dupRows = new Set(dups.groups.flatMap(g => g.map(r => r.row)));

  // If a server search is active, use those results directly (they cover
  // the whole sheet, not just the loaded page). If the query is cleared,
  // reset back to the locally loaded page.
  if (!q && S.searchActive) {
    S.searchResults = [];
    S.searchActive  = false;
  }

  let sorted = S.searchActive ? [...(S.searchResults || [])] : [...S.submissions];
  if (!S.searchActive) {
    if (S.currentSort === 'newest') sorted.sort((a,b) => b.timestamp - a.timestamp);
    else if (S.currentSort === 'oldest') sorted.sort((a,b) => a.timestamp - b.timestamp);
    else if (S.currentSort === 'name') sorted.sort((a,b) => (a.answers[0]||'').localeCompare(b.answers[0]||''));
  }
  if (q && !S.searchActive) sorted = sorted.filter(r => r.answers.some(a => (a||'').toLowerCase().includes(q)));

  const container = document.getElementById('resp-cards');
  if (!container) return;

  if (!sorted.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;flex-shrink:0" opacity="0.25"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div><div class="empty-text">${q ? 'No results for "'+q+'"' : 'No submissions yet'}</div></div>`;
    return;
  }

  // Find photo field index
  const photoIdx = fields.findIndex(f => f.type && f.type.includes('FILE_UPLOAD'));

  function adminCardHtml(r) {
    const isDup  = dupRows.has(r.row);
    const photo  = photoIdx >= 0 ? r.answers[photoIdx] || '' : '';
    const src    = photo ? getDriveThumb(photo) : '';

    const photoCompact  = src
      ? `<div class="pec-compact-photo"><img src="${src}" alt="" onerror="this.parentNode.classList.add('pec-no-photo');this.remove()"></div>`
      : `<div class="pec-compact-photo pec-no-photo"></div>`;
    const photoExpanded = src
      ? `<div class="pec-exp-photo"><img src="${src}" alt="" onerror="this.parentNode.classList.add('pec-no-photo');this.remove()"></div>`
      : `<div class="pec-exp-photo pec-no-photo"></div>`;

    const textFields  = fields.map((f,i) => ({f,i})).filter(({i}) => i !== photoIdx);
    const nameField   = textFields[0];
    const compactName = nameField ? (r.answers[nameField.i] || '—') : '—';
    const compactSub  = textFields.slice(1,3).map(({f,i}) => {
      let v = r.answers[i] || '';
      if (f.type && f.type.includes('DATE')) v = normalizeDate(v);
      return v;
    }).filter(Boolean).join(' · ');

    const filledTextFields = textFields.filter(({f,i}) => !!(r.answers[i] || '').trim());
    const emptyTextFields  = textFields.filter(({f,i}) => !(r.answers[i] || '').trim());

    const gridCells = filledTextFields.map(({f,i}) => {
      let v = r.answers[i] || '';
      if (f.type && f.type.includes('DATE')) v = normalizeDate(v);
      const isFull = (f.type && f.type.includes('PARAGRAPH')) || v.length > 28;
      return `<div class="pec-exp-cell${isFull ? ' full' : ''}" style="align-self:flex-start">
        <span class="pec-exp-lbl">${f.title}</span>
        <span class="pec-exp-val">${v}</span>
      </div>`;
    }).join('');

    // Not-filled fields collapse into a single compact line instead of each
    // reserving their own grid cell — keeps the card height sane even when
    // a form has many optional fields left blank.
    const notFilledNote = emptyTextFields.length
      ? `<div class="pec-not-filled-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.29 2.25h17.78A1.5 1.5 0 0 0 22.18 18L13.71 3.86a1.5 1.5 0 0 0-2.42 0Z"/></svg><span><b>Not filled:</b> ${emptyTextFields.map(({f}) => f.title).join(', ')}</span></div>`
      : '';

    const ts = r.timestamp
      ? new Date(r.timestamp).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
        + ' · ' + new Date(r.timestamp).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:true })
      : '';

    return `<div class="pec-id-card admin-pec" id="apec-${r.row}" onclick="toggleAdminPec(${r.row})">
      <div class="pec-compact">
        ${photoCompact}
        <div class="pec-compact-info">
          <div class="pec-compact-name">${isDup ? '<span style="font-size:.65em;font-weight:700;color:#f87171;margin-right:4px">⚠</span>' : ''}${compactName}</div>
          ${compactSub ? `<div class="pec-compact-sub">${compactSub}</div>` : ''}
        </div>
        <div class="pec-compact-right"><span class="pec-chevron">▼</span></div>
      </div>
      <div class="pec-expanded">
        <div class="pec-exp-hero">
          ${photoExpanded}
          <div class="pec-exp-name-block">
            <div class="pec-exp-name">${compactName}</div>
            <div class="pec-exp-role">${ts || 'Submitted'}</div>
            ${isDup ? `<div style="display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:3px 9px;border-radius:20px;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.2);font-size:.6em;font-weight:700;color:#f87171">⚠ Duplicate Entry</div>` : ''}
          </div>
        </div>
        <div class="pec-exp-divider"></div>
        <div class="pec-exp-grid">${gridCells}</div>
        ${notFilledNote}
        <div class="pec-exp-actions">
          <button class="pec-exp-btn-edit" onclick="event.stopPropagation();openEditRecord('${slug}',${r.row},${JSON.stringify(r.answers).replace(/"/g,'&quot;')})">✏️ Edit</button>
          <button class="pec-exp-btn-del"  onclick="event.stopPropagation();deleteRecordConfirm('${slug}',${r.row})">🗑 Delete</button>
        </div>
      </div>
    </div>`;
  }

  container.innerHTML = `<div class="responses-grid">${sorted.map(r => adminCardHtml(r)).join('')}</div>${(!S.searchActive && S.subHasMore) ? `
    <div style="text-align:center;margin-top:18px">
      <button id="load-more-entries-btn" onclick="loadMoreResponses('${slug}')"
        style="padding:9px 20px;border-radius:8px;font-size:.82em;font-weight:600;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#cbd5e1;cursor:pointer">
        Load 50 More (${S.submissions.length} of ${S.subTotal})
      </button>
    </div>` : ''}`;
}

function toggleAdminPec(row) {
  const card = document.getElementById('apec-' + row);
  if (!card) return;
  const isOpen = card.classList.contains('expanded');
  document.querySelectorAll('.admin-pec.expanded').forEach(c => c.classList.remove('expanded'));
  if (!isOpen) {
    card.classList.add('expanded');
    setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
  }
}

async function loadMoreResponses(slug) {
  const btn = document.getElementById('load-more-entries-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    const res = await api({ action: 'getManagerSubmissions', slug, managerPassword: S.password, offset: S.subOffset, limit: 50 });
    if (res.success) {
      S.submissions = S.submissions.concat(res.records || []);
      S.subOffset  += (res.records || []).length;
      S.subHasMore  = !!res.hasMore;
      if (typeof res.total === 'number') S.subTotal = res.total;
      renderResponseCards(slug);
    } else {
      toast(res.error || 'Failed to load more', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
    }
  } catch(e) {
    toast('Error: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
  }
}

function expandCard(card) {
  if (event.target.closest('button')) return;
  const expanded = card.querySelector('.sub-expanded');
  if (!expanded) return;
  const showing = expanded.style.display !== 'none';
  expanded.style.display = showing ? 'none' : 'block';
  const btn = card.querySelector('button[onclick*="toggleAdminMore"]');
  if (btn) btn.textContent = showing ? '+ more' : '- less';
}

function toggleAdminMore(btn) {
  const exp = btn.previousElementSibling;
  if (!exp || !exp.classList.contains('sub-expanded')) return;
  const open = exp.style.display !== 'none';
  exp.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '+ more' : '- less';
}

// Builds the ENTIRE Dup pill markup (icon, text, and — critically — the
// onclick/style/title that determine whether it's actually clickable).
// Used both for the initial render and for background refreshes, so a
// later count update can never leave a stale, mismatched onclick/title
// behind (previously only the inner text got patched, so a pill that
// started as "No Dups" — no onclick — could end up displaying a nonzero
// count while still being unclickable underneath).
function adminDupPillHtml(count, slug) {
  return count > 0
    ? `<div class="sort-pill" id="admin-dup-pill" style="background:rgba(239,68,68,.08);color:#f87171;border-color:rgba(239,68,68,.2);cursor:pointer" onclick="showDuplicates('${slug}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        ${count} Dup${count>1?'s':''}
      </div>`
    : `<div class="sort-pill" id="admin-dup-pill" style="opacity:.4;cursor:default" title="No duplicates found">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>
        No Dups
      </div>`;
}
function computeDuplicates(records, fields) {
  const keyIdx = fields.map((f, i) => ({ f, i }))
    .filter(o => !['LIST','MULTIPLE_CHOICE','CHECKBOX','FILE_UPLOAD'].some(t => (o.f.type||'').includes(t)))
    .map(o => o.i).slice(0, 4);
  if (!keyIdx.length) return { count: 0, groups: [] };
  const map = {};
  records.forEach(r => {
    const k = keyIdx.map(i => (r.answers[i]||'').trim().replace(/\s+/g,' ').toLowerCase()).join('|');
    if (!k) return;
    if (!map[k]) map[k] = [];
    map[k].push(r);
  });
  const groups = Object.values(map).filter(g => g.length > 1);
  return { count: groups.reduce((s,g) => s + g.length - 1, 0), groups };
}

// Admin edit modal — custom dropdown helpers
function toggleAdminEditOpts(idx) {
  const opts = document.getElementById('aef-opts-' + idx);
  if (!opts) return;
  // Close all other open dropdowns in this modal
  document.querySelectorAll('[id^="aef-opts-"]').forEach(el => {
    if (el.id !== 'aef-opts-' + idx) el.style.display = 'none';
  });
  opts.style.display = opts.style.display === 'none' ? 'block' : 'none';
}

function adminEditPickOpt(idx, value) {
  const hidden  = document.getElementById('ef-' + idx);
  const label   = document.getElementById('aef-label-' + idx);
  const trigger = document.getElementById('aef-trigger-' + idx);
  const opts    = document.getElementById('aef-opts-' + idx);
  if (hidden)  hidden.value = value;
  if (label)   label.textContent = value;
  if (trigger) trigger.classList.add('selected');
  opts?.querySelectorAll('.pub-custom-opt').forEach(o =>
    o.classList.toggle('selected', o.dataset.val === value)
  );
  if (opts) opts.style.display = 'none';

  // Cascade: look up from S.currentForm — no JSON passed via onclick attribute
  const fields   = S.currentForm && S.currentForm.def ? S.currentForm.def.fields || [] : [];
  const parentId = fields[idx] && fields[idx].id;
  if (!parentId) return;

  fields.forEach((f, ci) => {
    if (!f.dependsOn || f.dependsOn !== parentId) return;
    const childHidden  = document.getElementById('ef-' + ci);
    const childTrigger = document.getElementById('aef-trigger-' + ci);
    const childLabel   = document.getElementById('aef-label-' + ci);
    const childOpts    = document.getElementById('aef-opts-' + ci);
    if (!childHidden) return;
    let optionsMap = {};
    try { optionsMap = JSON.parse(decodeURIComponent(childHidden.dataset.optionsMap || '{}')); } catch(e) {}
    const childChoices = value ? (optionsMap[value] || []) : [];
    childHidden.value = '';
    if (childLabel)   childLabel.textContent = childChoices.length ? '— Select —' : 'No options';
    if (childTrigger) {
      childTrigger.classList.remove('selected');
      childTrigger.style.opacity       = childChoices.length ? '' : '0.45';
      childTrigger.style.pointerEvents = childChoices.length ? '' : 'none';
      childTrigger.onclick = childChoices.length ? () => toggleAdminEditOpts(ci) : null;
    }
    if (childOpts) {
      childOpts.innerHTML = childChoices.map(c =>
        `<div class="pub-custom-opt" data-val="${c}" onclick="adminEditPickOpt(${ci},this.dataset.val)">${c}</div>`
      ).join('');
      childOpts.style.display = 'none';
    }
  });
}


async function saveEditRecord(slug, row, oldAnswers, fieldCount) {
  const fields  = S.currentForm && S.currentForm.def ? S.currentForm.def.fields || [] : [];
  const btn     = document.getElementById('edit-save-btn');
  if (btn) { btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; }

  showProgress('Saving entry…', 'Please wait');
  updateProgress(10, 'Preparing…');

const values    = {};   // keyed object for v3 backend
  const valuesArr = [];   // array for local state update
  for (let i = 0; i < fields.length; i++) {
    const f   = fields[i];
    const fid = f.id || String(i);
    let val;
    if (f.type && f.type.includes('FILE_UPLOAD')) {
      const fileInput = document.getElementById('ef-file-' + i);
      if (fileInput && fileInput.files.length) {
        updateProgress(20, 'Uploading file…');
        try {
          const url = await uploadFileFrontend(fileInput.files[0], slug, '', (pct, sub) => updateProgress(pct, sub));
          val = url;
          updateProgress(90, 'File uploaded OK');
        } catch (e) {
          hideProgress();
          toast('File upload failed: ' + e.message, 'error');
          if (btn) { btn.innerHTML = 'Save'; btn.disabled = false; }
          return;
        }
      } else {
        val = oldAnswers[i] || '';
      }
    } else if (f.type && f.type.includes('CHECKBOX')) {
      const checked = [];
      (f.choices||[]).forEach((c, ci) => {
        const cb = document.getElementById('ef-cb-' + i + '-' + ci);
        if (cb && cb.checked) checked.push(c);
      });
      val = checked.join(', ');
    } else {
      const el = document.getElementById('ef-' + i);
      val = el ? el.value.trim() : (oldAnswers[i] || '');
    }
    values[fid] = val;
    valuesArr.push(val);
  }

  updateProgress(95, 'Saving to server…');
  try {
    const res = await apiPost({ action: 'updateRecord', slug, row, values, password: S.password });
    hideProgress();
    if (res.success) {
      toast('Entry updated', 'success');
      document.querySelector('.modal-backdrop')?.remove();
      // Update local state
      const rec = S.submissions.find(r => r.row === row);
      if (rec) rec.answers = valuesArr;  // use array for local display
      renderResponseCards(slug);
    } else {
      hideProgress();
      toast(res.error, 'error');
      if (btn) { btn.innerHTML = 'Save'; btn.disabled = false; }
    }
  } catch (e) {
    hideProgress();
    toast(e.message, 'error');
    if (btn) { btn.innerHTML = 'Save'; btn.disabled = false; }
  }
}

async function exportCSV(slug) {
  const fields = S.currentForm && S.currentForm.def ? S.currentForm.def.fields || [] : [];
  showProgress('Preparing CSV…', 'Fetching all entries from server');

  let allRecords = [];
  try {
    // Fetch all entries in one go using a high limit
    const res = await api({ action: 'getManagerSubmissions', slug, managerPassword: S.password, offset: 0, limit: 9999 });
    if (res.success) allRecords = res.records || [];
    else throw new Error(res.error || 'Failed to fetch');
  } catch(e) {
    hideProgress();
    toast('CSV export failed: ' + e.message, 'error');
    return;
  }
  hideProgress();

  const headers = ['Timestamp', ...fields.map(f => f.title)];
  const rows    = allRecords.map(r => [new Date(r.timestamp).toLocaleString(), ...r.answers.map((val, i) => {
    const f = fields[i];
    if (f && f.type && f.type.includes('DATE')) return normalizeDate(val);
    return val;
  })]);
  const csv  = [headers, ...rows].map(row =>
    row.map(v => '"' + String(v||'').replace(/"/g, '""') + '"').join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href  = URL.createObjectURL(blob);
  link.download = slug + '-responses.csv';
  link.click();
}

let _dlPollTimer = null;

async function startPhotoDownload(slug) {
  const fields      = S.currentForm && S.currentForm.def ? S.currentForm.def.fields || [] : [];
  const photoIdx    = fields.findIndex(f => f.type && f.type.includes('FILE_UPLOAD'));
  const renameIdxEl = document.getElementById('dl-rename-field');
  const renameIdx   = renameIdxEl ? parseInt(renameIdxEl.value) : -1;

  const startBtn  = document.getElementById('dl-start-btn');
  const statusTxt = document.getElementById('dl-status-text');
  const pctTxt    = document.getElementById('dl-pct-text');

  // Fetch ALL submissions from server (not just the 50 loaded in S.submissions)
  let allSubmissions = [...S.submissions];
  if (S.subTotal > S.submissions.length) {
    if (startBtn) { startBtn.disabled = true; startBtn.innerHTML = '<span class="spin"></span> Loading all entries…'; }
    try {
      const res = await api({ action: 'getManagerSubmissions', slug, managerPassword: S.password, offset: 0, limit: 9999 });
      if (res.success) allSubmissions = res.records || [];
    } catch(e) {
      if (startBtn) { startBtn.disabled = false; startBtn.innerHTML = '⬇ Start Download'; }
      toast('Failed to load all entries: ' + e.message, 'error');
      return;
    }
    if (startBtn) { startBtn.disabled = true; startBtn.innerHTML = '<span class="spin"></span> Starting…'; }
  }

  const photos = allSubmissions
    .filter(r => r.answers[photoIdx])
    .map(r => ({
      photoUrl:    r.answers[photoIdx],
      renameValue: renameIdx >= 0 ? (r.answers[renameIdx] || '') : ''
    }));

  if (!photos.length) { toast('No photos to download', 'error'); return; }

    const cancelBtn = document.getElementById('dl-cancel-btn');
  const progWrap  = document.getElementById('dl-progress-wrap');
  const bar       = document.getElementById('dl-progress-bar');
  const detailTxt = document.getElementById('dl-detail-text');
  const errTxt    = document.getElementById('dl-error-text');

  if (startBtn)  { startBtn.disabled = true; startBtn.innerHTML = '<span class="spin"></span> Starting…'; }
  if (progWrap)  progWrap.style.display = '';
  if (errTxt)    errTxt.style.display = 'none';
  if (statusTxt) statusTxt.textContent = 'Sending to worker…';

  try {
    if (!WORKER_URL || WORKER_URL.includes('PASTE_YOUR')) {
      throw new Error('WORKER_URL not configured — please add your Worker script URL in the config at the top of this file.');
    }

    const res  = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'startJob', photos, folderName: slug }),
      redirect: 'follow'
    });
    const data = await res.json();

    if (!data.success) throw new Error(data.error || 'Worker failed to start');

    const jobId = data.jobId;
    if (startBtn)  startBtn.style.display = 'none';
    if (cancelBtn) cancelBtn.textContent = 'Close';

    _dlPollTimer && clearInterval(_dlPollTimer);
    _dlPollTimer = setInterval(async () => {
      try {
        const sUrl = WORKER_URL + '?data=' + encodeURIComponent(JSON.stringify({ action: 'getStatus', jobId }));
        const sr   = await fetch(sUrl, { redirect: 'follow' });
        const sd   = await sr.json();
        if (!sd.success) { clearInterval(_dlPollTimer); return; }

        const pct = sd.pct || 0;
        if (bar)       bar.style.width = pct + '%';
        if (pctTxt)    pctTxt.textContent = pct + '%';
        if (detailTxt) detailTxt.textContent = `${sd.processed} of ${sd.total} photos copied${sd.errors > 0 ? ' · ' + sd.errors + ' failed' : ''}`;

        if (sd.status === 'running') {
          // Detect if GAS is between batches (trigger fired, new batch not started yet)
          const secsSinceUpdate = sd.lastUpdateAt
            ? Math.round((Date.now() - sd.lastUpdateAt) / 1000) : 0;

          if (secsSinceUpdate > 40) {
            if (statusTxt) statusTxt.textContent = '⏳ Batch complete — next batch starting on Google servers…';
            if (detailTxt) detailTxt.textContent = `${sd.processed} of ${sd.total} done · Last update ${secsSinceUpdate}s ago · Safe to close and come back`;
          } else {
            if (statusTxt) statusTxt.textContent = sd.processed < 20 ? 'Copying photos…' : 'Large batch — running in background…';
          }
        } else if (sd.status === 'ready') {
          clearInterval(_dlPollTimer);
          if (bar)       bar.style.width = '100%';
          if (pctTxt)    pctTxt.textContent = '100%';
          if (statusTxt) statusTxt.textContent = 'All done!';
          if (detailTxt) detailTxt.textContent = `${sd.processed} photos copied${sd.errors > 0 ? ' · ' + sd.errors + ' errors' : ' · No errors'}`;

          const doneWrap   = document.getElementById('dl-done-wrap');
          const folderLink = document.getElementById('dl-folder-link');
          if (doneWrap)   doneWrap.style.display = '';
          if (folderLink) folderLink.href = sd.folderUrl;
          toast('Photos ready in Drive!', 'success');
        }
      } catch(pollErr) { console.warn('Poll error:', pollErr); }
    }, 5000);
  } catch(e) {
    if (startBtn)  { startBtn.disabled = false; startBtn.innerHTML = 'Start Download'; }
    if (progWrap)  progWrap.style.display = 'none';
    if (errTxt)    { errTxt.style.display = ''; errTxt.textContent = 'Error: ' + e.message; }
  }
}

async function loadJobHistory() {
  const wrap = document.getElementById('dl-history-wrap');
  if (!wrap) return;

  if (!WORKER_URL || WORKER_URL.includes('PASTE_YOUR')) {
    wrap.innerHTML = '<span style="color:#4a5370">Configure WORKER_URL to see history</span>';
    return;
  }

  try {
    const url  = WORKER_URL + '?data=' + encodeURIComponent(JSON.stringify({ action: 'getHistory' }));
    const res  = await fetch(url, { redirect: 'follow' });
    const data = await res.json();

    if (!data.success || !data.history || !data.history.length) {
      wrap.innerHTML = '<span style="color:#3d4560">No previous jobs found</span>';
      return;
    }

    const statusColor = s => s === 'ready' ? '#f04400' : s === 'running' ? '#fbbf24' : '#f87171';
    const statusIcon  = s => s === 'ready' ? '✓' : s === 'running' ? '⏳' : '✗';
    const timeAgo = ts => {
      if (!ts) return '—';
      const s = Math.round((Date.now() - ts) / 1000);
      if (s < 60)   return s + 's ago';
      if (s < 3600) return Math.round(s/60) + 'min ago';
      if (s < 86400) return Math.round(s/3600) + 'hr ago';
      return Math.round(s/86400) + 'd ago';
    };

    wrap.innerHTML = data.history.map(h => `
      <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <span style="color:${statusColor(h.status)};flex-shrink:0">${statusIcon(h.status)}</span>
        <div style="flex:1;min-width:0">
          <div style="color:#8891a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.folderName || '—'}</div>
          <div style="color:#3d4560;font-size:.9em">${h.processed !== undefined ? h.processed + '/' : ''}${h.total} photos · ${timeAgo(h.startedAt)}</div>
        </div>
        ${h.status === 'ready'
          ? `<a href="${h.folderUrl}" target="_blank" style="flex-shrink:0;padding:4px 9px;border-radius:5px;background:rgba(240,68,0,.1);color:#f04400;border:1px solid rgba(240,68,0,.2);text-decoration:none;font-size:.88em">Open</a>`
          : h.status === 'running'
          ? `<span style="flex-shrink:0;padding:4px 9px;border-radius:5px;background:rgba(251,191,36,.08);color:#fbbf24;border:1px solid rgba(251,191,36,.2);font-size:.88em">Running</span>`
          : ''
        }
      </div>`).join('');
  } catch(e) {
    wrap.innerHTML = '<span style="color:#f87171">Failed to load history</span>';
    }
  }

// ── Adaptive polling: 45s while active, pauses when tab hidden,
//    backs off to 3min after 2min of no user interaction ──
const POLL_ACTIVE_MS = 45000;
const POLL_IDLE_MS   = 180000;
const IDLE_AFTER_MS  = 120000;

let _pubCountPollTimer = null;
let _lastInteractionAt = Date.now();

['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt =>
  document.addEventListener(evt, () => { _lastInteractionAt = Date.now(); }, { passive: true })
);

function startCountPolling(slug) {
  stopCountPolling();
  const tick = async () => {
    try {
      const res = await api({ action: 'getFormStats', slug });
      if (res.success && res.total !== _pubTotal) {
        const diff = res.total - _pubTotal;
        _pubTotal = res.total;
        updateCountBadges();
        if (diff > 0) {
          const note = document.getElementById('pub-new-note');
          if (note) { note.textContent = '+' + diff + ' new since you loaded'; note.style.display = 'inline'; }
        }
      }
    } catch (e) {}
    if (_pubCountPollTimer === null) return; // stopped mid-flight
    const idle = Date.now() - _lastInteractionAt > IDLE_AFTER_MS;
    _pubCountPollTimer = setTimeout(tick, idle ? POLL_IDLE_MS : POLL_ACTIVE_MS);
  };
  _pubCountPollTimer = setTimeout(tick, POLL_ACTIVE_MS);
}
function stopCountPolling() {
  if (_pubCountPollTimer) { clearTimeout(_pubCountPollTimer); _pubCountPollTimer = null; }
}

// Pause polling when tab is hidden, resume when visible again
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopCountPolling();
  } else {
    if (_pubCountPollTimer === null && _pubSlug) { _lastInteractionAt = Date.now(); startCountPolling(_pubSlug); }
  }
});
function updateCountBadges() {
  const cnt = document.getElementById('pub-entries-count');
  if (cnt) cnt.textContent = '(' + _pubTotal + ')';
  const totalEl = document.getElementById('pub-stat-total');
  if (totalEl) totalEl.textContent = _pubTotal.toLocaleString();
  const ownEl = document.getElementById('pub-stat-own');
  if (ownEl) ownEl.textContent = _pubOwnCount.toLocaleString();
}

// Fetch full entries — called lazily on first Entries tab open
async function loadPubEntries() {
  try {
    const panel = document.getElementById('pub-panel-entries');
    if (panel) showPubEntriesSkeleton(panel);

    // Run getSubmissions and getDupCount in parallel — saves 1-2 seconds
    const [res, dc] = await Promise.all([
      api({ action: 'getSubmissions', slug: _pubSlug, deviceId: getDeviceId(), offset: 0, limit: 50 }),
      api({ action: 'getDupCount', slug: _pubSlug }).catch(() => null)
    ]);

    if (res.success) {
      const localOwned = getDeviceOwnedRows(_pubSlug);
      _pubEntries  = (res.records || []).map(r => ({
        ...r,
        isOwn: r.isOwn || localOwned.includes(r.row)
      }));
      _pubTotal    = res.total    || _pubEntries.length;
      _pubOwnCount = res.ownCount || _pubEntries.filter(r => r.isOwn).length;
      _pubOffset   = _pubEntries.length;
      _pubHasMore  = !!res.hasMore;
      _pubEntriesLoaded = true;
      updateCountBadges();

      // Auto Mine filter: activate if user has own entries, else show All
      _pubFilterMine = _pubOwnCount > 0;

      // Update dup badge from parallel fetch result
      if (dc && dc.success) {
        const dupCnt = document.getElementById('pub-dups-count');
        if (dupCnt) dupCnt.textContent = '(' + (dc.groupCount || 0) + ')';
      }

      if (document.getElementById('pub-panel-entries')?.style.display !== 'none')
        renderPubEntriesPanel();
    }
  } catch(e) { console.warn('loadPubEntries error:', e); }
}

// Fetch the next page of entries — appended to whatever is already loaded
async function loadMorePubEntries() {
  const btn = document.getElementById('pub-load-more-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    const res = await api({ action: 'getSubmissions', slug: _pubSlug, deviceId: getDeviceId(), offset: _pubOffset, limit: 50 });
    if (res.success) {
      const localOwned = getDeviceOwnedRows(_pubSlug);
      const existingRows = new Set(_pubEntries.map(r => r.row));
      (res.records || []).forEach(r => {
        if (!existingRows.has(r.row)) {
          _pubEntries.push({ ...r, isOwn: r.isOwn || localOwned.includes(r.row) });
        }
      });
      _pubOffset += (res.records || []).length;
      _pubHasMore = !!res.hasMore;
      if (typeof res.total === 'number') _pubTotal = res.total;
      if (typeof res.ownCount === 'number') _pubOwnCount = res.ownCount;
      updateCountBadges();
      renderPubEntriesPanel();
    } else {
      toast(res.error || 'Failed to load more', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
    }
  } catch(e) {
    toast('Error loading more entries', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Load 50 More'; }
  }
}

// Fetch full dup list — called lazily on first Dups tab open
async function loadPubDups() {
  try {
    const panel = document.getElementById('pub-panel-dups');
    if (panel) panel.innerHTML = `<div style="text-align:center;padding:40px 20px">
      <div style="display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto">

            <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px">
              <div class="skel" style="height:12px;width:65%"></div>
              <div class="skel" style="height:10px;width:45%"></div>
              <div class="skel" style="height:10px;width:55%"></div>
            </div>

    _pubDupInfo = await fetchPublicDuplicates();

}

function pubSwitchTab(tab) {
  if (tab === 'form' && _pubLocked) { toast('Submissions are closed for this form.', 'error'); return; }
  document.getElementById('pub-tab-form').classList.toggle('active', tab === 'form');
  document.getElementById('pub-tab-entries').classList.toggle('active', tab === 'entries');
  document.getElementById('pub-tab-dups').classList.toggle('active', tab === 'dups');
  document.getElementById('pub-panel-form').style.display    = tab === 'form'    ? '' : 'none';
  document.getElementById('pub-panel-entries').style.display = tab === 'entries' ? '' : 'none';
  document.getElementById('pub-panel-dups').style.display    = tab === 'dups'    ? '' : 'none';

  if (tab === 'entries') {
    if (!_pubEntriesLoaded) {
      loadPubEntries(); // first time only — shows skeleton then renders
    } else {
      renderPubEntriesPanel();
    }
  }
  if (tab === 'dups') {
    if (!_pubDupsLoaded) {
      loadPubDups(); // first time only — shows skeleton then renders
    } else {
      renderPubDupsPanel();
    }
  }
}

function renderPubEntriesPanel() {
  const panel = document.getElementById('pub-panel-entries');
  if (!panel) return;

  const acc      = _pubAccent;
  const ownCount = _pubOwnCount;
  const total    = _pubTotal;
  const searchQ  = panel.querySelector('#pub-ent-search')?.value || '';
  const hasFilter = _pubManagerMode && (Object.values(_pubDropFilters).some(s => s.size > 0) || _pubDateFilter.type !== null);
  const mineBtnActive = _pubFilterMine && !hasFilter;

  // ── Compute filtered entries ──────────────────────
  // In manager mode use the full unblurred dataset, otherwise use own+blurred entries
  const baseEntries = _pubManagerMode ? _pubMgrEntries : _pubEntries;
  let entries = baseEntries;

  if (searchQ.trim()) {
    const q = searchQ.trim().toLowerCase();
    // Manager: search all entries. Normal: search only own entries
    entries = baseEntries.filter(r => (_pubManagerMode || r.isOwn) && r.answers.some(a => (a||'').toLowerCase().includes(q)));
  } else if (hasFilter) {
    // AND logic across fields: entry must match ALL active filter groups
    entries = baseEntries.filter(r => {
      // Drop filter check
      const dropOk = Object.entries(_pubDropFilters).every(([fi, vals]) => {
        if (!vals || vals.size === 0) return true;
        const ans = (r.answers[parseInt(fi)] || '').trim();
        return vals.has(ans);
      });
      if (!dropOk) return false;
      // Date filter check
      if (_pubDateFilter.type) {
        const ts = r.timestamp;
        if (!ts) return false;
        const d = new Date(ts);
        const today = new Date(); today.setHours(0,0,0,0);
        if (_pubDateFilter.type === 'today') {
          const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
          if (d < today || d >= tomorrow) return false;
        } else if (_pubDateFilter.type === 'yesterday') {
          const yest = new Date(today); yest.setDate(today.getDate()-1);
          if (d < yest || d >= today) return false;
        } else if (_pubDateFilter.type === 'range') {
          if (_pubDateFilter.from) {
            const from = new Date(_pubDateFilter.from); from.setHours(0,0,0,0);
            if (d < from) return false;
          }
          if (_pubDateFilter.to) {
            const to = new Date(_pubDateFilter.to); to.setHours(23,59,59,999);
            if (d > to) return false;
          }
        }
      }
      return true;
    });
    // Pin own entries to top
    entries = [
      ...entries.filter(r => r.isOwn),
      ...entries.filter(r => !r.isOwn)
    ];
  } else if (_pubFilterMine) {
    entries = baseEntries.filter(r => r.isOwn);
  }

  const filteredTotal = entries.length;
  const filteredOwn   = entries.filter(r => r.isOwn).length;

  // ── Build filter groups HTML ──────────────────────
  // Fields eligible: LIST (dropdown), MULTIPLE_CHOICE (radio), CHECKBOX
  // Skip blood-group-style fields: every option contains "+" or "-"
  const isBloodGroupField = f => {
    const ch = f.choices || [];
    return ch.length > 0 && ch.every(c => {
      const v = (typeof c === 'string' ? c : (c.value || c.label || '')).trim();
      return v.includes('+') || v.includes('-');
    });
  };

  const filterFields = _pubManagerMode ? _pubFields
    .map((f, i) => ({f, i}))
    .filter(({f}) => {
      const t = (f.type || '').toUpperCase();
      if (!(t.includes('LIST') || t.includes('MULTIPLE_CHOICE') || t.includes('CHECKBOX'))) return false;
      if (isBloodGroupField(f)) return false;
      // cascading fields have no flat choices — derive them from optionsMap
      const hasChoices = (f.choices && f.choices.length > 0) ||
        (f.optionsMap && Object.keys(f.optionsMap).length > 0);
      return hasChoices;
    }) : [];

  let filterHtml = '';
  if (filterFields.length > 0) {
    filterHtml = `<div class="pub-filter-wrap" id="pub-filter-wrap">`;
    filterFields.forEach(({f, i}) => {
      const vals  = _pubDropFilters[i] || new Set();
      const open  = _pubFilterExpanded[i] === true; // default collapsed
      const choices = f.choices && f.choices.length
        ? f.choices
        : Object.values(f.optionsMap || {}).flat();

      // Use server-side counts (full dataset) when available,
      // fall back to client-side count from loaded entries only
      const serverCounts = _pubFieldCounts[f.id] || null;
      const counts = {};
      choices.forEach(c => {
        const cv = typeof c === 'string' ? c : (c.value || c.label || c);
        counts[cv] = serverCounts
          ? (serverCounts[cv] || 0)
          : _pubEntries.filter(r => (r.answers[i]||'').trim() === cv).length;
      });

      const pillsHtml = choices.map(c => {
        const cv   = typeof c === 'string' ? c : (c.value || c.label || c);
        const cnt  = counts[cv] || 0;
        const active = vals.has(cv) ? 'active' : '';
        return `<span class="pub-filter-pill ${active}" style="--filter-acc:${acc}"
          onclick="pubToggleFilterPill(${i},'${cv.replace(/'/g,"\\'")}',this)">
          ${cv} <span class="pfc">${cnt}</span>
        </span>`;
      }).join('');

      filterHtml += `
      <div class="pub-filter-group">
        <div class="pub-filter-head" onclick="pubToggleFilterGroup(${i})">
          <span>Filter by ${f.title}</span>
          <svg class="pub-filter-head-icon ${open ? 'open' : ''}" id="pfh-icon-${i}"
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>

        </div>
        ${open ? `<div class="pub-filter-pills" id="pfp-${i}">${pillsHtml}</div>` : `<div id="pfp-${i}" style="display:none" class="pub-filter-pills">${pillsHtml}</div>`}
      </div>`;
    });

    filterHtml += `</div>`;
  }

  // ── Date filter group ─────────────────────────────
  const hasDateFilter  = _pubDateFilter.type !== null;
  const dfOpen = _pubFilterExpanded['__date__'] === true;
  const dfTodayActive = _pubDateFilter.type === 'today' ? 'active' : '';
